const TAILS=[[/ · just now$/,' · ahora mismo'],[/ · (\d+) min ago$/,' · hace $1 min'],[/ · (\d+) h ago$/,' · hace $1 h'],[/ · (\d+) d ago$/,' · hace $1 d']];
function sp(x){return x==='Start'?'Salida':names(x)}
function names(x){for(const[re,s]of NAMES)x=x.replace(re,s);return x}
const POLI=['Los Azules','Los Federicos','Los Federales','Los Chotas','Los Fede'];
function poli(){const t=(S&&S.turnCount)||0;let h=Math.imul(t+7,2654435761)>>>0;h^=h>>>15;h=Math.imul(h,2246822519)>>>0;h^=h>>>13;return POLI[(h>>>0)%POLI.length]}
function fillPoli(x){return typeof x==='string'&&x.indexOf('{POLI}')>=0?x.split('{POLI}').join(poli()):x}
function tr(s){return fillPoli(tr0(s))}
function tr0(s){
  if(LANG!=='es'||s==null)return s;
  const m=String(s).match(/^(\s*)([\s\S]*?)(\s*)$/),core=m[2];if(!core)return s;
  let r=ES[core];
  if(r==null){r=core;for(const[re,fn]of RULES){const x=core.match(re);if(x){r=fn(x);break}}
    for(const[re,rep]of TAILS)r=r.replace(re,rep);r=names(r)}
  return m[1]+r+m[3];
}
const t=tr;
function trDom(root){
  if(!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&n.parentElement.closest('[data-notr],#chatlist,script,style')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const ns=[];while(w.nextNode())ns.push(w.currentNode);
  for(const n of ns){const v=n.nodeValue;
    if(n._tr!=null&&v===n._tr){if(LANG!=='es'){n.nodeValue=n._orig;n._tr=null}continue}
    if(LANG==='es'&&v.trim()){const x=tr(v);if(x!==v){n._orig=v;n._tr=x;n.nodeValue=x}}}
  root.querySelectorAll('[aria-label],[placeholder],[title]').forEach(el=>{if(el.closest('[data-notr]'))return;el._oa=el._oa||{};
    for(const a of ['aria-label','placeholder','title']){const v=el.getAttribute(a);if(v==null)continue;const o=el._oa[a];
      if(o&&v===o.t){if(LANG!=='es'){el.setAttribute(a,o.o);delete el._oa[a]}continue}
      if(LANG==='es'){const x=tr(v);if(x!==v){el._oa[a]={o:v,t:x};el.setAttribute(a,x)}}}});
}
function setLang(v){LANG=v==='es'?'es':'en';SETUP.forEach(p=>{if(LANG==='es'&&p.name==='You')p.name='Tú';else if(LANG==='en'&&p.name==='Tú')p.name='You'});try{localStorage.setItem('cs-lang',LANG)}catch(_){}document.documentElement.lang=LANG;render();renderSettings();renderChat();trDom($('app'))}
function rulesES(){
  const towns=Object.keys(GROUPS).map(g=>{const G=GROUPS[g],ps=TOWN[g].map(k=>BOARD[k].p);
    return `<tr><td><i style="background:${G.c}"></i>${G.n}</td><td>${TOWN[g].length}</td><td class="num">${fmt(Math.min(...ps))}${Math.max(...ps)!==Math.min(...ps)?'–'+fmt(Math.max(...ps)):''}</td><td class="num">${fmt(G.oc)}</td></tr>`}).join('');
  return `<div class="panel rules"><div class="vhead"><button class="back" data-act="rulesback">${icon('back')}Atrás</button><h2>Reglas del juego</h2></div>
  <h3>Objetivo</h3><p>Sé el último que queda en la calle. Los demás quiebran y tú te quedas con el tablero.</p>
  <h3>Preparación</h3><p>De dos a seis jugadores. Todos empiezan en la Salida con $1,500, y el orden de turnos se sortea al azar una sola vez al principio.</p>
  <h3>Tu turno</h3><ul>
   <li>Tira dos dados y avanza esa cantidad de casillas.</li>
   <li>Si sacas dobles, vuelves a tirar después de moverte. Tres dobles seguidos te mandan directo pa\' la Federal.</li>
   <li>Cobra $200 cada vez que pases o caigas en la Salida.</li>
   <li>Entre jugadas puedes intercambiar, construir, vender e hipotecar.</li></ul>
  <h3>Comprar y subastas</h3><p>Si caes en una propiedad sin dueño, puedes comprarla a su precio de lista. Si no la compras, sale a subasta de inmediato. Todos ofertan, tú también, en saltos de $10 o $50. Cada oferta reinicia el reloj de 6 segundos y gana la oferta más alta cuando se acaba. Si nadie oferta, se queda con el banco.</p>
  <h3>Renta</h3><p>Si caes en la propiedad de otro, pagas renta. Tener un pueblo completo duplica la renta base de sus propiedades vacías. Las pisos y la torre la suben mucho más. Toca cualquier casilla del tablero para ver su tabla de rentas. Las propiedades hipotecadas no cobran renta.</p>
  <h3>Pueblos y construcción</h3>
  <table class="rt"><tr><th>Pueblo</th><th>Casillas</th><th>Precio</th><th>Por piso</th></tr>${towns}</table>
  <ul><li>Necesitas todas las propiedades de un pueblo para construir, sin ninguna hipotecada.</li>
   <li>Construye de forma pareja: ninguna propiedad tiene un segundo piso hasta que todas tengan uno, y así sucesivamente.</li>
   <li>Después de 4 pisos, la próxima construcción es una torre, que le devuelve los 4 pisos al banco.</li>
   <li>El banco solo tiene 32 pisos y 12 torres. Cuando se acaban, nadie construye hasta que vuelvan algunas.</li>
   <li>Vender reembolsa la mitad del costo, y también debe ser parejo en el pueblo.</li></ul>
  <h3>Tren Urbano, Capitolio y servicios</h3>
  <table class="rt"><tr><th>Estaciones</th><th></th><th>Renta</th></tr><tr><td>1</td><td></td><td>$25</td></tr><tr><td>2</td><td></td><td>$50</td></tr><tr><td>3</td><td></td><td>$100</td></tr><tr><td>4</td><td></td><td>$200</td></tr></table>
  <p>LUMA y AAA cobran 4× los dados si tienes uno, o 10× si el mismo jugador tiene los dos. El Capitolio, en San Juan, es único: cobra una tarifa fija de $60.</p>
  <h3>Tarjetas</h3><p>Al caer en Chanza o Comunidad sacas una tarjeta de ese mazo: cobrar, pagar, moverte, reparaciones de tus edificios o un viaje pa\' la Federal. La Sal Gratis se guarda hasta usarlo y se puede intercambiar. Las tarjetas que te mandan a la estación más cercana cobran el doble de renta; la del servicio más cercano te hace tirar y pagar 10× los dados.</p>
  <h3>Impuestos</h3><p>Hacienda te cobra $200 y el IVU $100. Hacienda va pal banco; el IVU se lo queda el dueño del Capitolio (si no tiene dueño, va pal banco).</p>
  <h3>La Federal</h3><ul>
   <li>Vas pa\' la Federal desde la casilla ¡Te Cogieron {POLI}!, por una tarjeta o por tres dobles seguidos. No cobras $200 en el camino.</li>
   <li>Para salir: paga $50 antes de tirar, usa una Sal Gratis o saca dobles, que te mueven con esa tirada.</li>
   <li>Tras tres tiradas fallidas pagas $50 y te mueves.</li>
   <li>Caer en la Federal con una tirada normal solo significa que estás de paso. Sigues cobrando renta mientras estás en la Federal.</li></ul>
  <h3>El Chinchorro</h3><p>No pasa nada. Tómate un respiro.</p>
  <h3>Hipotecas</h3><p>Hipoteca una propiedad por la mitad de su precio. Deja de cobrar renta hasta que alces la hipoteca por esa cantidad más un 10%. Vende los edificios de un pueblo antes de hipotecar sus propiedades. Las propiedades hipotecadas se pueden intercambiar; el nuevo dueño paga una cuota del 10%.</p>
  <h3>Intercambios</h3><p>Intercambia propiedades, dinero y Sal Gratis con cualquiera entre jugadas. Las propiedades de un pueblo con edificios no se pueden intercambiar hasta vender los edificios. Las ofertas se pueden contraofertar hasta tres veces.</p>
  <h3>Deudas y quiebra</h3><p>Si debes más de lo que tienes, reúne el dinero vendiendo edificios, hipotecando o intercambiando. Si no puedes, quiebras. Lo que tenías pasa a quien le debías, con los edificios convertidos en dinero a la mitad de su costo. Si le debías al banco, tus propiedades se subastan.</p>

/* public rooms: who is hosting an open room right now */
function cleanLob(l){if(!l||typeof l!=='object')return null;const code=String(l.code||'');if(!/^[a-z]{4}$/.test(code))return null;
  const n=Math.max(1,Math.min(6,Math.floor(+l.n)||1)),max=Math.max(2,Math.min(6,Math.floor(+l.max)||6));
  return{code,nick:String(l.nick||'Player').slice(0,14),c:Number.isInteger(+l.c)&&+l.c>=0&&+l.c<6?+l.c:0,rs:l.rs==='turbo'?'turbo':'clasico',n,max}}
function roomDir(){let cb=null,un=null;const R=()=>NET.room;
  return{
    start(f){cb=f;if(un||!R()||typeof R().onPeers!=='function')return;try{un=R().onPeers(()=>{if(cb)cb()})}catch(_){}},
    rooms(){const g=R();if(!g||typeof g.peers!=='function')return[];const out=[],seen=new Set();
      for(const x of g.peers()){if(x.sameTab)continue;const l=cleanLob(x.presence&&x.presence.lob);if(!l||seen.has(l.code))continue;seen.add(l.code);out.push(l)}return out},
    ready(){return !!R()},
    announce(info){const g=R();if(g&&typeof g.presence==='function')Promise.resolve(g.presence({lob:info||null})).catch(()=>{})}
  }}
const DIR=typeof makeDir==='function'?makeDir():roomDir();
function openRooms(){return DIR.rooms().filter(l=>l.n<l.max&&l.code!==NET.code)}
function dirStart(){DIR.start(()=>{if(UI.screen==='setup'&&MODE==='online'&&NET.browse)render()})}
function lobbyAnnounce(info){const k=info?JSON.stringify(info):'';if(k===NET.lobAnn)return;NET.lobAnn=k;DIR.announce(info||null)}
function lobSet(){if(NET.host&&NET.g)NET.g.presence({max:NET.max,pub:NET.pub}).catch(()=>{})}
function lobbyMax(){if(NET.host)return NET.max;const h=NET.peers.find(x=>x.presence&&x.presence.role==='host');const m=h&&Math.floor(+h.presence.max);return m>=2&&m<=6?m:6}
function lobbyPub(){if(NET.host)return NET.pub;const h=NET.peers.find(x=>x.presence&&x.presence.role==='host');return !!(h&&h.presence.pub)}
async function onlineQuick(){
  if(!ONAME.trim()){NET.err=vx('Escribe tu nombre primero.','Enter your name first.');render();return}
  if(NET.busy)return;NET.err='';NET.quick=true;dirStart();render();
  const tried=new Set();
  for(let t=0;t<14;t++){
    const list=openRooms().filter(l=>!tried.has(l.code));
    if(list.length){const l=list[rnd(list.length)];tried.add(l.code);OCODE=l.code;
      if(await enterRoom(l.code,false)){NET.quick=false;S=null;UI.screen='lobby';render();return}
      NET.err='';continue}
    if(t>=4&&DIR.ready())break;
    await new Promise(r=>setTimeout(r,500));
    if(UI.screen!=='setup'||MODE!=='online'){NET.quick=false;return}
  }

  await onlineCreate(true);
}

/* room */
async function enterRoom(code,host){
  if(NET.busy)return false;NET.busy=true;NET.err='';render();
  try{
    const g=await NET.room.join('g-'+code,host);
    Object.assign(NET,{g,code,host,peers:g.peers(),chat:[],hostCid:host?MYCID:null,lastSid:'',lastSeq:-1,joinedAt:Date.now(),sid:Math.random().toString(36).slice(2,8),seq:0,last:''});
    NET.unsub=[
      g.onPeers(ch=>{NET.peers=ch.peers;const fresh=ch.joined.some(x=>!x.isMe);
        if(NET.host&&fresh){NET.last='';if(S&&S.online)scheduleSync();sendChatlog()}render()}),
      g.on('state',onState),g.on('act',onAct),g.on('fx',onFx),g.on('tres',onTres),g.on('chat',onChat),g.on('chatlog',onChatlog),g.on('reset',onReset),g.on('react',onReact),g.on('sb',onSb)];
    await g.presence({cid:MYCID,nick:(ONAME.trim()||'Player').slice(0,14),c:OCOL,role:host?'host':'guest',jt:Date.now(),max:host?NET.max:null,pub:host?NET.pub:null,bots:host?LBOTS:[],spd:host?SPEEDK:null,rs:host?RULESET:null,bd:host?BOTDIFF:null});
    NET.noSend=false;g.emit('act',{cid:MYCID,a:'ping',d:{}}).catch(e=>{if(e&&e.code==='not_permitted'){NET.noSend=true;render()}});
    try{localStorage.setItem('cs-code',code)}catch(_){}
    OCODE=code;clearInterval(NET.beat);
    if(host)NET.beat=setInterval(()=>{if(S&&S.online){NET.last='';scheduleSync()}},4000);
    renderChat(true);setTimeout(render,4500);
    return true;
  }catch(e){NET.err=e&&e.code==='no_game'?vx('No hay juego abierto con ese código. Revisa las letras, o el que lo creó cerró la página.','No open game with that code. Check the letters, or the host closed the page.'):e&&e.code==='taken'?vx('Ese código está en uso. Toca Crear juego otra vez.','That code is taken. Tap Create game again.'):e&&e.code==='not_permitted'?'You need Contributor or Editor access to this page to play online.':vx('No se pudo conectar. Revisa tu internet y trata otra vez.','Could not connect. Check your internet and try again.');return false}
  finally{NET.busy=false}
}
async function onlineCreate(pub){

    if(!NET.db)break;try{const d=await NET.db.doc('games/'+code).get();if(!d.exists)break}catch(_){break}}

  for(const x of ps){const pr=x.presence,cid=String(pr.cid);if(seen.has(cid))continue;seen.add(cid);
    out.push({cid,nick:String(pr.nick||'Player').slice(0,14),c:Number.isInteger(+pr.c)&&+pr.c>=0&&+pr.c<6?+pr.c:0,host:pr.role==='host'})}

function hostBots(){

}

document.addEventListener('submit',e=>{if(e.target&&e.target.id==='chatform'){e.preventDefault();sendChat()}});
function netUI(){
  const on=!!NET.g&&(UI.screen==='lobby'||UI.screen==='game');$('v-chat').hidden=!on;
  if(on){const n=new Set(NET.peers.filter(x=>x.presence&&x.presence.cid).map(x=>x.presence.cid)).size,con=NET.g.connected();
    $('chath').innerHTML=`<span class="mu">Room</span><b>${esc(NET.code.toUpperCase())}</b><span class="ntag" style="margin-left:auto"><i class="netdot${con?'':' off'}"></i>${con?n+' online':'Reconnecting…'}${S&&S.online&&mySeat()<0?' · watching':''}</span>`}
  const bn=$('netbanner');
  if(bn){const away=!!(NET.g&&!NET.host&&S&&S.online&&UI.screen==='game'&&Date.now()-NET.joinedAt>4000&&!NET.peers.some(x=>x.presence&&x.presence.role==='host'));
    const ns=!!(NET.g&&NET.noSend&&UI.screen==='game');bn.hidden=!(away||ns);bn.style.color=ns?'var(--danger)':'';
    if(ns)bn.textContent=NOSEND;else if(away)bn.textContent='The host is away. The game continues when they come back.'}
}
/* floating balance bubble: the acting player's cash, with the change from each action floating off it.
   Shown on Manage and Trade; add a screen to balWho() to show it elsewhere. */
const BAL={i:null,cash:null};
function balWho(){if(!S)return null;
  if(UI.screen==='manage'&&UI.actor!=null)return S.players[UI.actor];
  if(UI.screen==='trade'&&UI.trade)return S.players[UI.trade.from];
  return null}
function balBubble(){
  let el=$('balbub');const p=balWho();
  document.body.classList.toggle('has-bal',!!p);
  if(!p){if(el)el.hidden=true;BAL.i=null;return}
  if(!el){el=document.createElement('div');el.id='balbub';el.className='balbub';el.setAttribute('aria-live','polite');
    el.innerHTML='<i class="dot"></i><span class="bal-l"></span><b class="bal-v"></b>';document.body.appendChild(el)}
  el.hidden=false;
  if(BAL.i===p.i&&BAL.cash!=null&&BAL.cash!==p.cash){const d=p.cash-BAL.cash,f=document.createElement('span');
    el.querySelectorAll('.bal-d').forEach(x=>x.remove());f.className='bal-d '+(d>0?'gain':'loss');f.textContent=(d>0?'+':'−')+fmt(Math.abs(d));el.appendChild(f);setTimeout(()=>f.remove(),1900);
    el.classList.remove('bump','bgain','bloss');void el.offsetWidth;el.classList.add('bump',d>0?'bgain':'bloss');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('bgain','bloss'),1600)}
  BAL.i=p.i;BAL.cash=p.cash;
  el.querySelector('.dot').style.background=p.color;el.querySelector('.bal-l').textContent=LANG==='es'?'Tu balance':'Your balance';el.querySelector('.bal-v').textContent=fmt(p.cash);
}
/* the "Ta bien" button takes the exact width of the card above it */
function fitCardBtn(){const w=document.querySelector('.card-wrap>.flip,.card-wrap>.card'),b=document.querySelector('.card-wrap>[data-act=gotit]');if(!w||!b)return;const px=w.getBoundingClientRect().width.toFixed(1)+'px';if(px!=='0px'&&b.style.width!==px)b.style.width=px}
try{new MutationObserver(fitCardBtn).observe(document.body,{childList:true,subtree:true});addEventListener('resize',fitCardBtn)}catch(_){}
function render(){
  soundDiff();
  if(SPIN&&S&&S.online&&!NET.host&&UI.screen==='game')return;
  if(S&&S.online)route();
  if(UI.screen==='lobby'){show('lobby');$('newgame').hidden=true;$('v-lobby').innerHTML=lobbyHTML();netUI();trDom($('app'));return}
  render0();balBubble();netUI();trDom($('app'));armBtns();
  if(NET.host&&S&&S.online)scheduleSync();
  flushFXQ();xportDraw();
}
/* Consola transport strip: who's up, the round and the game clock, in one row above the board */
function xportDraw(){const el=$('xport');if(!el)return;const on=!!(S&&S.players&&UI.screen==='game'&&document.documentElement.dataset.skin==='term');el.hidden=!on;if(!on)return;
  const p=cur(),pulse=Date.now()-(UI.turnAt||0)<1200;
  el.innerHTML=`<span class="xc xturn${pulse?' tpulse':''}"><small>${vx('TURNO','TURN')}</small><span class="who"><i class="dot" style="background:${p.color}"></i><span>${esc(p.name)}</span></span></span>`+
    `<span class="xc"><small>${S.vs?(S.turbo?'TURBO':'VERSUS'):vx('CLÁSICO','CLASSIC')}</small><b class="num">${S.vs?String(Math.min(S.round||1,vsR())).padStart(2,'0')+'/'+String(vsR()).padStart(2,'0'):String(S.round||1).padStart(2,'0')}</b></span>`+
    `<span class="xc"><small>${vx('TIEMPO','TIME')}</small><b class="num" id="xtime">${fmtDur(gameMs())}</b></span>`;
  el.setAttribute('data-notr','');}
function send(a,d){
  if(NET.host){const s=mySeat();if(s>=0)hostHandle(s,a,d)}
  else if(NET.g)NET.g.emit('act',{cid:MYCID,a,d}).catch(e=>{if(e&&e.code==='not_permitted'){NET.noSend=true;render()}});
}

/* clicks that belong to online play */
function netClick(a,b,i){
  switch(a){
    case 'ocolor':OCOL=(OCOL+1)%6;try{localStorage.setItem('cs-col',OCOL)}catch(_){}render();return true;
    case 'ocreate':onlineCreate(b.dataset.v==='pub');return true;
    case 'oquick':onlineQuick();return true;
    case 'obrowse':NET.browse=b.dataset.v==='1';NET.err='';if(NET.browse)dirStart();render();return true;
    case 'ojoinc':{if(!ONAME.trim()){NET.err=vx('Escribe tu nombre primero.','Enter your name first.');NET.browse=false;render();return true}
      const c=String(b.dataset.code||'');if(!/^[a-z]{4}$/.test(c))return true;OCODE=c;
      enterRoom(c,false).then(ok=>{if(ok){NET.browse=false;S=null;UI.screen='lobby'}render()});return true}
    case 'opub':if(NET.host){NET.pub=b.dataset.v==='1';lobSet();render()}return true;
    case 'omax':if(NET.host){const v=Math.floor(+b.dataset.v);if(v>=2&&v<=6&&v>=lobbyPeople().length+LBOTS.length){NET.max=v;lobSet();render()}}return true;
    case 'oretry':location.reload();return true;
    case 'operm':{const P=NET.perms;if(!P){netInit();return true}
      (b.dataset.v==='man'?Promise.resolve(P.manage()).catch(()=>{}):Promise.resolve(P.request(['room','db','user'])).catch(()=>{})).then(()=>{NET.ok=null;render();netInit()});return true}
    case 'ojoin':onlineJoin();return true;
    case 'oresume':onlineResume(b.dataset.code);return true;
    case 'odel':if(NET.db){NET.db.doc('games/'+b.dataset.code).delete().catch(()=>{});NET.saved=NET.saved.filter(g=>g.code!==b.dataset.code);render()}return true;
    case 'oleave':leaveRoom();return true;
    case 'ocopy':{const t=NET.code.toUpperCase();try{navigator.clipboard.writeText(t).then(()=>{b.textContent=tr('Copied')},()=>{b.textContent=t})}catch(_){b.textContent=t}return true}
    case 'obot':{if(!NET.host)return true;const ppl=lobbyPeople();if(ppl.length+LBOTS.length>=NET.max)return true;
      const names=['Papo','Wiso','Chegüi','Tito','Yeyo','Cuco'],used=new Set(ppl.map(x=>x.c).concat(LBOTS.map(x=>x.c)));
      const c=[0,1,2,3,4,5].find(x=>!used.has(x));LBOTS.push({name:names.find(n=>!LBOTS.some(x=>x.name===n))||'Bot',c:c==null?0:c});
      if(NET.g)NET.g.presence({bots:LBOTS}).catch(()=>{});render();return true}
    case 'obotrm':if(NET.host){LBOTS.splice(i,1);if(NET.g)NET.g.presence({bots:LBOTS}).catch(()=>{});render()}return true;
    case 'ostart':if(NET.host)onlineStart();return true;
    case 'takeover':if(NET.host&&S&&S.online)takeover(i);return true;
  }
  if(!S||!S.online)return false;
  const me=mySeat();
  switch(a){
    case 'newgame':
      if(UI.confirmNew){UI.confirmNew=false;if(NET.host)hostToLobby();else leaveRoom()}
      else{UI.confirmNew=true;render();setTimeout(()=>{if(UI.confirmNew){UI.confirmNew=false;render()}},2500)}
      return true;
    case 'again':if(NET.host)hostToLobby();else leaveRoom();return true;
    case 'oplay':return !NET.host;
    case 'roll':case 'end':case 'buy':case 'decline':case 'gotit':case 'paycf':case 'bail':case 'usecard':case 'passbid':case 'dpay':send(a,{});return true;
    case 'vbuild':case 'vstop':case 'vbuy':case 'vno':case 'vskip':case 'decok':case 'decno':send(a,{});return true;
    case 'vpick':send('vpick',{k:+b.dataset.k});return true;
    case 'tile':if(PEND&&PEND.kind==='target'&&PEND.data.opts.includes(+b.dataset.k)&&S.turn===me){send('vpick',{k:+b.dataset.k});return true}return false;
    case 'bid':send('bid',{n:+b.dataset.n});return true;
    case 'addb':case 'sell':case 'mort':case 'unmort':case 'qsell':send(a,{k:+b.dataset.k});return true;
    case 'dbank':if(UI.dconf){UI.dconf=false;send('dbank',{})}else{UI.dconf=true;render()}return true;
    case 'bback':return !!(S.debt&&S.debt.p===me);
    case 'dtrade':{const to=active().find(x=>x.i!==me);if(to)openTrade(me,to.i);return true}
    case 'tsend':{const T=UI.trade,err=validate(T);if(err){$('terr').textContent=unesc(err);return true}
      const o={from:T.from,to:T.to,give:{props:[...T.give.props],cards:[...T.give.cards],cash:T.give.cash},get:{props:[...T.get.props],cards:[...T.get.cards],cash:T.get.cash},counters:T.counters};
      LAST=o;T.sent=true;T.result=S.players[T.to].human?{k:'wait'}:{k:'msg',msg:'Sending…'};send('offer',{o});render();return true}
    case 'taccept':{const T=UI.trade;if(!T||!T.result||T.result.k!=='counter'||!LAST)return true;
      const o=JSON.parse(JSON.stringify(LAST));o.give.cash+=T.result.gap;
      if(o.give.cash>S.players[me].cash){T.result={k:'msg',msg:"You don't have enough cash for that counter."};render();return true}
      T.give.cash=o.give.cash;LAST=o;T.result={k:'msg',msg:'Sending…'};send('offer',{o});render();return true}
    case 'tdecline':if(UI.trade){UI.trade.result={k:'msg',msg:'Counter declined. Change your offer or go back.'};render()}return true;
    case 'tcancel':send('ocancel',{});if(UI.trade)UI.trade.result=null;render();return true;
    case 'tdone':case 'tback':{const T=UI.trade;
      if(T&&((T.result&&T.result.k==='wait')||(T.counterOf&&!T.sent)))send('ocancel',{});
      UI.trade=null;UI.screen=S.debt&&S.debt.p===me?'manage':'game';if(UI.screen==='manage')UI.actor=me;render();return true}
    case 'raccept':case 'rdecline':{const o=UI.review;if(o){UI.answered=o.id;send('oresp',{id:o.id,v:a==='raccept'?'accept':'decline'})}
      UI.review=null;UI.screen=UI.trade?'trade':'game';render();return true}
    case 'rcounter':{const o=UI.review;if(!o||o.counters>=3)return true;UI.answered=o.id;send('oresp',{id:o.id,v:'counter'});UI.review=null;
      openTrade(o.to,o.from,{props:[...o.get.props],cards:[...o.get.cards],cash:o.get.cash},{props:[...o.give.props],cards:[...o.give.cards],cash:o.give.cash},o.counters+1);
      UI.trade.counterOf=o.id;return true}
  }
  return false;
}
setInterval(()=>{if(S&&S.online&&!NET.host&&S.auction&&UI.screen==='game'){const b=$('abar');if(b)b.style.width=Math.max(0,aLeft()/60)+'%'}},100);


/* ---------- boot ---------- */
try{const k=localStorage.getItem('cs-skin');if(k==='term'||k==='pop'||k==='clean2')document.documentElement.dataset.skin=k}catch(_){}
try{const th=localStorage.getItem('cs-theme');if(th==='dark'||th==='light')document.documentElement.dataset.theme=th}catch(_){}
buildBoard();soundIcon();render();netInit();
</script>
