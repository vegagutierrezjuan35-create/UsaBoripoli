<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BORIPOLI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column. Board on top, players and log under it; setup, trade, build and offers open as their own views with a back button. */
:root{
  --page:#e7e7e4; --tile:#f1f1ee; --panel:#fcfcfb; --line:#d8d8d3; --line2:#a9a9a3; --raised:#ffffff;
  --tx:#1c1c1b; --mu:#5e5e5b; --bld:#2a2a2a; --sig:#6b6b64;
  --prim:#0b4fc4; --shield:#1f6fff; --primbg:#e3ecfb; --prc:#d0102e; --prb:#0b4fc4; --danger:#a32d2d; --lossbg:#fbe7e7; --tint:#ecece8;
  --hqring:transparent; --pbg:#0b4fc4; --pfg:#ffffff; --pbd:#083c96; --segsh:0 1px 2px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.06);
  --gloss:rgba(255,255,255,.75); --tokb:#151515; --popsh:0 4px 14px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.08); --wmo:.07; --card:#ffffff; --cardsh:0 10px 26px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.08); --tintp:24%; --tintd:34%; --mns:#e3f4f4; --mnt:#0d4547; --chc:#f0b4a8; --chk:#5a1a10; --bms:#f4e8f8; --bmt:#4a2159;
  --f:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#111112; --tile:#262628; --panel:#1b1b1d; --line:#343437; --line2:#5a5a60; --raised:#303033;
  --tx:#ececee; --mu:#a8a8ad; --bld:#161616; --sig:#8e8e93;
  --prim:#93b6ff; --shield:#5b9dff; --primbg:#1d2638; --prc:#ff5a6e; --prb:#2f5fd0; --danger:#f09595; --lossbg:#3a2727; --tint:#29292c;
  --hqring:rgba(255,255,255,.5); --pbg:#86aaf5; --pfg:#061a3d; --pbd:#86aaf5; --segsh:0 1px 3px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.06);
  --gloss:rgba(255,255,255,.14); --tokb:#f4f4f4; --popsh:0 6px 18px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.35); --wmo:.08; --card:#3a3a3e; --cardsh:0 12px 30px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.35); --tintp:30%; --tintd:34%; --mns:#2f3b3c; --mnt:#bde8ea; --chc:#e09a8c; --chk:#3d0f08; --bms:#3a2f3f; --bmt:#e6c9f0; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#111112; --tile:#262628; --panel:#1b1b1d; --line:#343437; --line2:#5a5a60; --raised:#303033;
  --tx:#ececee; --mu:#a8a8ad; --bld:#161616; --sig:#8e8e93;
  --prim:#93b6ff; --shield:#5b9dff; --primbg:#1d2638; --prc:#ff5a6e; --prb:#2f5fd0; --danger:#f09595; --lossbg:#3a2727; --tint:#29292c;
  --hqring:rgba(255,255,255,.5); --pbg:#86aaf5; --pfg:#061a3d; --pbd:#86aaf5; --segsh:0 1px 3px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.06);
  --gloss:rgba(255,255,255,.14); --tokb:#f4f4f4; --popsh:0 6px 18px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.35); --wmo:.08; --card:#3a3a3e; --cardsh:0 12px 30px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.35); --tintp:30%; --tintd:34%; --mns:#2f3b3c; --mnt:#bde8ea; --chc:#e09a8c; --chk:#3d0f08; --bms:#3a2f3f; --bmt:#e6c9f0; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,svg{-webkit-user-drag:none}
/* no pinch or double-tap zoom, no sideways swipe, no bounce; vertical scrolling still works */
html,body{touch-action:pan-y;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:hidden}
button,[data-act]{touch-action:manipulation}
body{background:var(--page);color:var(--tx);font-family:var(--f);font-size:14px;padding-inline:16px;padding-block:12px 28px;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.num{font-variant-numeric:tabular-nums}
.mu{color:var(--mu)}
button{font:inherit;color:var(--tx);background:var(--tile);border:0.5px solid var(--line2);border-radius:6px;padding:8px 10px;cursor:pointer;min-height:34px;line-height:1.2}
button:focus-visible,input:focus-visible,[data-act]:focus-visible{outline:1.5px solid var(--tx);outline-offset:1px}
button.pr{background:var(--pbg);border-color:var(--pbd);color:var(--pfg);font-weight:500}
button:disabled{opacity:.4;cursor:default}
button.ghost{background:transparent;border-color:transparent;color:var(--mu)}
input{font:inherit;color:var(--tx);background:var(--raised);border:0.5px solid var(--line);border-radius:6px;padding:0 10px;height:36px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mark{display:flex;align-items:center;gap:7px;font-weight:500;font-size:15px;letter-spacing:.01em}
.mark svg{color:var(--mu)}
.prflag{width:24px;height:24px;flex:none;display:block;color:var(--tx)}
.sigflag{width:10px;height:10px;flex:none;color:currentColor}
.logo{font-family:var(--f);font-weight:700;letter-spacing:-.035em;font-size:20px;line-height:1;text-transform:lowercase;color:var(--tx)}
.mark{gap:8px}
.wmflag{width:40px;height:40px;display:block;color:var(--tx)}
.wm .logo{font-size:18px;letter-spacing:-.035em;font-weight:700;text-transform:lowercase}
.wm small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.top-acts{display:flex;gap:6px}
.icon-btn{width:36px;padding:0;display:flex;align-items:center;justify-content:center;background:transparent;border-color:var(--line)}
.icon-btn svg{width:18px;height:18px}
.panel{background:var(--panel);border:0.5px solid var(--line);border-radius:10px;padding:12px}
.vhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.vhead h2{font-size:17px;font-weight:500;margin:0;flex:1}
.back{display:flex;align-items:center;gap:5px;padding:5px 11px 5px 6px;background:transparent;border-color:var(--line);color:var(--tx)}
.back svg{color:var(--prim)}
.back svg{width:19px;height:19px}
.lphint{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--mu);border:1.5px dashed var(--line2);border-radius:8px;padding:4px 10px 4px 8px;margin:0 0 4px}
.lphint svg{width:15px;height:15px;flex:none}
.balbub{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:8px;padding:9px 16px 9px 13px;border-radius:999px;background:var(--raised);color:var(--tx);border:1.5px solid var(--line2);box-shadow:var(--popsh);font-size:12.5px;white-space:nowrap;transition:border-color .3s}
.balbub .dot{width:10px;height:10px}
.bal-l{color:var(--mu)}
.bal-v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.balbub.bgain{border-color:var(--prim)}.balbub.bloss{border-color:var(--danger)}
.balbub.bump{animation:balbump .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes balbump{0%{transform:translateX(-50%) scale(1)}35%{transform:translateX(-50%) scale(1.08)}100%{transform:translateX(-50%) scale(1)}}
.bal-d{position:absolute;left:50%;bottom:calc(100% + 4px);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;pointer-events:none;animation:baldelta 1.8s ease-out forwards}
.bal-d.gain{color:var(--prim)}.bal-d.loss{color:var(--danger)}
@keyframes baldelta{0%{opacity:0;transform:translate(-50%,8px)}15%{opacity:1;transform:translate(-50%,0)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-22px)}}
body.has-bal{padding-bottom:84px}
@media (prefers-reduced-motion: reduce){.balbub.bump{animation:none}.bal-d{animation:rxfade 1.8s ease-out forwards}}

/* hold targets in Trade and Manage share the dashed "cut here" edge of the hold hint */
:is(#v-trade,#v-manage,#v-review) .chip[data-lp]{border-style:dashed;border-width:1.5px}
:is(#v-trade,#v-manage,#v-review) .chip[data-lp].on{border-style:solid}
#v-manage .lpname{display:block;justify-self:start;max-width:100%;border:1.5px dashed var(--line2);border-radius:8px;padding:4px 8px;cursor:pointer}
#v-review .offer-item[data-lp]{border:1.5px dashed var(--line2);border-radius:8px;padding:4px 8px;align-self:flex-start}

.lbl{font-size:12px;color:var(--mu);margin:14px 0 6px;letter-spacing:.02em}

/* board */
.board{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));grid-template-rows:repeat(11,minmax(0,1fr));gap:2px;aspect-ratio:1;width:100%;max-width:100%}
.tile{position:relative;min-width:0;border-radius:2px;background:var(--tile);border:0.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--mu);overflow:hidden;cursor:pointer;padding:0;min-height:0;min-width:0}
.tile.prop{background:color-mix(in srgb,var(--gc) var(--tintp),var(--tile));border-color:color-mix(in srgb,var(--gc) 45%,var(--line))}
.tile.deck{background:color-mix(in srgb,var(--gc) var(--tintd),var(--tile));color:var(--dt);border-color:color-mix(in srgb,var(--gc) 50%,var(--line))}
.tile svg.ic{width:56%;height:56%;max-width:16px;max-height:16px}
.tile.corner{color:var(--tx)}
.tile.sel{outline:2px solid var(--prim);outline-offset:-2px}
.tile.hit{outline:1.5px solid var(--tx);outline-offset:-1.5px}
.tile.shield{box-shadow:inset 0 0 0 2px var(--shield),inset 0 0 6px 1px color-mix(in srgb,var(--shield) 45%,transparent)}
.tile.tgt{outline:2px dashed var(--prim);outline-offset:-2px;animation:tgtp 1.1s ease-in-out infinite}
@keyframes tgtp{50%{outline-color:transparent}}
.vsr{font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--primbg);color:var(--prim);white-space:nowrap}
.vsr.last{background:var(--lossbg);color:var(--danger)}
.tgtlist{display:flex;flex-direction:column;gap:4px;overflow:auto;min-height:0;flex:1}
.tgtlist button{display:flex;align-items:center;gap:7px;text-align:left;font-size:12.5px;padding:6px 8px;min-height:30px}
.tgtlist button>i:first-child{width:9px;height:9px;border-radius:2px;flex:none}
.tgtlist button span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgtlist button svg{width:15px;height:15px;color:var(--shield);flex:none}
.tgtlist button.shd{border-color:var(--shield)}
.vshint{font-size:12px;line-height:1.5;color:var(--mu);background:var(--tint);border-radius:10px;padding:8px 10px;margin:0 0 8px}
.vshint b{color:var(--tx);font-weight:600}
.shrow{color:var(--shield);font-size:12px;display:flex;align-items:center;gap:5px}.shrow svg{width:14px;height:14px}
.lpwrap .card.shpop{align-items:center;text-align:center;padding:22px 16px 18px;gap:8px;aspect-ratio:auto;border:2px solid var(--shield)}
.shpop .shbig{width:56px;height:56px;color:var(--shield)}.shpop .shbig svg{width:100%;height:100%}
.shpop h3{margin:0;font-size:19px}.shpop p{margin:0;font-size:13.5px;line-height:1.45}
.shpop .shprop{display:inline-flex;align-items:center;gap:6px;font-weight:600}.shpop .shprop i{width:10px;height:10px;border-radius:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--mu)}
.legend span{display:flex;align-items:center;gap:5px}
.vhead .tb{display:flex;align-items:center;gap:5px;font-size:12.5px}
.vhead .tb svg{width:15px;height:15px}
.strip{position:absolute;display:flex;align-items:center;justify-content:center;gap:1px}
.off{width:3px;height:3px;border-radius:1px;background:var(--bld)}
.hq{background:var(--bld);border-radius:1px}
/* building badge: white tag with house + count; HQ is a dark tag with the star. Same tag on board, Manage, cards and rules */
.bdg{display:inline-flex;align-items:center;justify-content:center;gap:1px;flex:none;background:#fff;color:#151515;border-radius:3px;height:9px;min-width:13px;padding:0 2px 0 1.5px;font-size:7.5px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;font-style:normal;box-shadow:0 0 0 .5px rgba(0,0,0,.45),0 1px 1.5px rgba(0,0,0,.18)}
.bdg svg{width:5.5px;height:5.5px;flex:none}
.bdg.hq{background:#151515;color:#fff;min-width:11px;padding:0 2px;box-shadow:0 0 0 .75px rgba(255,255,255,.8),0 1px 1.5px rgba(0,0,0,.25)}
.bdg.hq svg{width:6.5px;height:6.5px;color:#ffc928}
.bdg.md{height:14px;min-width:24px;gap:2.5px;padding:0 4px 0 3.5px;font-size:10px;border-radius:4px}
.bdg.md svg{width:8px;height:8px}.bdg.hq.md svg{width:9px;height:9px}
.bdg.lg{height:20px;min-width:36px;gap:4px;padding:0 7px 0 6px;font-size:12px;border-radius:6px;box-shadow:0 0 0 1px var(--line2)}
.bdg.lg svg{width:11px;height:11px}.bdg.hq.lg,.bdg.hq.md{box-shadow:0 0 0 1px var(--hqring)}.bdg.hq.lg svg{width:12px;height:12px}
.bdg.z{background:transparent;color:var(--mu);box-shadow:inset 0 0 0 1px var(--line2)}
.strip.s-left{align-items:flex-start;padding-left:1px}.strip.s-right{align-items:flex-end;padding-right:1px}
.own{position:absolute;width:5px;height:5px;border-radius:50%}
.tok{position:absolute;width:12px;height:12px;border-radius:50%;border:2px solid var(--tokb);box-shadow:0 0 0 1.5px var(--tile),0 1px 3px rgba(0,0,0,.4);transform:translate(-50%,-50%);z-index:2;transition:left .12s,top .12s}
.center{grid-row:2/11;grid-column:2/11;background:var(--panel);border:0.5px solid var(--line);border-radius:2px;min-width:0;min-height:0;overflow:auto;display:flex;flex-direction:column;padding:10px 12px;gap:7px;font-size:13px}
.c-row{display:flex;justify-content:space-between;align-items:center;gap:6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--tx);flex:none}
.who{display:flex;align-items:center;gap:6px;min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dice{display:flex;gap:8px;justify-content:center;margin-top:2px}
.die{width:40px;height:40px;border-radius:8px;border:0.5px solid var(--line2);background:var(--tile);display:flex;align-items:center;justify-content:center;font-size:19px;font-variant-numeric:tabular-nums}
.die.sp{color:var(--mu)}
.step{text-align:center;color:var(--mu);font-size:12px;min-height:15px}
.status{text-align:center;font-size:12.5px;min-height:16px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto}
.acts .full{grid-column:1/-1}
.acts button{min-height:32px;padding:6px 6px;font-size:13px}
.c-wait{margin-top:auto;text-align:center;color:var(--mu);font-size:12px}

/* auction */
.au-band{height:5px;margin:-10px -12px 2px;flex:none}
.bid{font-size:21px}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;flex:none}
.bar>div{height:100%;background:var(--tx)}
.au-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:4px;align-items:center}
.au-row button{min-height:28px;padding:4px 7px;font-size:12px}
.au-list{display:flex;flex-direction:column;gap:2px;border-top:0.5px solid var(--line);padding-top:5px}
.au-watch{grid-template-columns:minmax(0,1fr) auto;font-size:12px;min-height:22px}

/* cards */
.card{position:relative;aspect-ratio:5/7;max-width:100%;border-radius:10px;background:var(--card);border:0.5px solid var(--line2);box-shadow:var(--cardsh);display:flex;flex-direction:column;overflow:hidden;animation:cardin .22s ease-out}
.card .band{display:flex;align-items:center;gap:5px;font-size:11px;padding:7px 9px;flex:none}
.card .band svg{width:13px;height:13px}
.card .body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:0 10px 16px}
.card .txt{font-size:12.5px;line-height:1.4;margin:0}
.card .eff{font-size:10.5px;margin:0;padding:4px 7px;border-radius:5px;align-self:flex-start}
.sig{position:absolute;right:6px;bottom:5px;display:flex;align-items:center;gap:3px;font-size:8.5px;line-height:1;color:var(--sig)}
@keyframes cardin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.card-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;min-height:0;padding:4px 0 8px}
.card-wrap .card{height:100%;max-height:205px;width:auto}
.card-wrap>button,.card-wrap>.c-wait{position:relative;z-index:3;flex:none}

/* detail */
.det-strip{height:8px;border-radius:2px;flex:none}
.det-name{font-size:15px;font-weight:500}
.det-tab{width:100%;border-collapse:collapse;font-size:12px}
.det-tab td{padding:2px 0}
.det-tab td:last-child{text-align:right}

/* players + log */
.plist{display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:6px}
.prow.cur{background:var(--tint)}
.prow.out{opacity:.45;text-decoration:line-through}
.prow .nm{flex:1;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:2px 6px;border-radius:4px;border:none;min-height:0;line-height:1.3;cursor:pointer}
.badge svg{width:11px;height:11px}
.hhead{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mu);margin-top:8px;padding:8px 8px 4px;border-top:0.5px solid var(--line)}
.hmore{font-size:12px;padding:2px 8px;min-height:0;border-radius:99px;background:none;border:0;color:var(--prim)}
.log li{grid-template-columns:1fr auto!important}
.log{list-style:none;margin:0;padding:0 4px 0 0;font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:2px;max-height:176px;overflow-y:auto;overscroll-behavior:contain}
.log li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:center;padding:3px 8px;border-radius:6px;min-height:24px}
.log li:first-child{color:var(--tx);background:var(--tint)}
.log .lt{font-variant-numeric:tabular-nums;color:var(--mu);font-size:11px}
.log .lm{min-width:0;overflow-wrap:anywhere}
.hcard{display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:2px 8px 2px 6px;font-size:11px;border-radius:6px;border:0.5px solid var(--line2);background:transparent;color:var(--tx)}
.hcard svg{width:13px;height:13px}
.lastcard{display:flex;align-items:center;gap:6px;font-size:13px;background:transparent;border-color:var(--line);margin-right:auto}
.lastcard svg{width:16px;height:16px}

/* setup */
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:0.5px solid var(--line)}
.srow:last-child{border-bottom:none}
.colorpick{width:30px;height:30px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;min-height:0;background:transparent;border-color:transparent}
.colorpick span{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--tx)}
.seg{display:flex;border:0.5px solid var(--line);border-radius:8px;overflow:hidden;background:var(--tint);padding:2px;gap:2px}
.seg button{border:none;border-radius:0;min-height:32px;padding:4px 9px;font-size:12px;background:transparent;color:var(--mu)}
.seg button.on{background:var(--raised);color:var(--tx);border-radius:6px;box-shadow:var(--segsh);font-weight:500}
.hint{font-size:12px;color:var(--mu);line-height:1.5;margin:10px 0 0}
.err{font-size:12px;color:var(--danger);min-height:16px;margin-top:6px}

/* trade */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:stretch;padding:0;min-height:34px;overflow:hidden;background:color-mix(in srgb,var(--gc,var(--line2)) 18%,var(--tile));color:var(--tx);border:0.5px solid color-mix(in srgb,var(--gc,var(--line2)) 55%,var(--line))}
.chip .s{width:8px;flex:none}
.chip.on{box-shadow:0 0 0 1.5px var(--tx)}
.tprev{margin-top:12px;border:0.5px solid var(--line2);border-radius:10px;background:var(--raised);padding:10px 12px;display:flex;flex-direction:column;gap:7px;font-size:13px}
.tprev .card{max-width:170px;margin:0 auto;height:auto}
.bal{color:var(--mu);font-weight:400;font-variant-numeric:tabular-nums}
.chip span{padding:7px 9px;display:flex;align-items:center;gap:4px;font-size:12.5px}
.chip span svg{width:12px;height:12px}
.chip.on{border:1px solid var(--tx);color:var(--tx);background:var(--raised)}
.cash{display:flex;align-items:center;gap:6px;margin-top:8px;border:0.5px solid var(--line);border-radius:6px;background:var(--raised);padding:0 10px;width:150px;max-width:100%}
.cash input{border:none;background:transparent;padding:0;height:34px;width:100%;font-variant-numeric:tabular-nums}
.cash input:focus-visible{outline:none}
.cash:focus-within{outline:1.5px solid var(--tx);outline-offset:1px}
.partners{display:flex;flex-wrap:wrap;gap:6px}
.partners button{display:flex;align-items:center;gap:6px;font-size:12.5px}
.partners button.on{border:1px solid var(--tx);background:var(--raised)}
.result{margin-top:12px;padding:10px;border-radius:8px;background:var(--tint);line-height:1.5;font-size:13px}
.result b{font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.empty{font-size:12.5px;color:var(--mu)}

/* build */
.town{border-top:0.5px solid var(--line);padding-top:10px;margin-top:10px}
.town:first-of-type{border-top:none;margin-top:0;padding-top:0}
.town-h{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px}
.town-h i{width:14px;height:6px;border-radius:1px;display:inline-block}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:6px;align-items:center;padding:5px 0;font-size:13px}
.brow button{min-height:30px;width:34px;padding:0}
.lvl{display:flex;gap:2px;align-items:center;min-width:44px;justify-content:flex-end}

/* pass + over */
.big{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:36px 12px}
.big .dot{width:22px;height:22px;border-width:2px}
.big h2{font-size:20px;font-weight:500;margin:0;text-wrap:balance}
.big p{margin:0;color:var(--mu);max-width:32ch;line-height:1.5}
.offer-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.offer-item{display:flex;align-items:center;gap:8px;font-size:13.5px}
.offer-item i{width:5px;height:16px;border-radius:1px;display:inline-block}
/* money + action feedback */
.board{position:relative}
.bfx{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;padding-top:20%;gap:5px;z-index:5}
.fxpill{padding:6px 12px;border-radius:999px;font-size:14px;font-weight:500;border:1px solid;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;animation:fxup 4.6s ease-out forwards}
.fxpill.loss{background:var(--lossbg);color:var(--danger);border-color:var(--danger)}
.fxpill.gain{background:var(--primbg);color:var(--prim);border-color:var(--prim)}
.fxpill.info{background:var(--raised);color:var(--tx);border-color:var(--line2)}
@keyframes fxup{0%{opacity:0;transform:translateY(8px) scale(.96)}10%{opacity:1;transform:none}78%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-10px)}}
.tile.glow{animation:tglow 3.2s ease-out}
@keyframes tglow{0%,45%{background:var(--gbg);outline:2px solid var(--gc);outline-offset:-2px}100%{background:var(--tile);outline:2px solid transparent;outline-offset:-2px}}
.pfx-wrap{position:relative}
.pfx{position:absolute;right:12px;font-size:14px;font-weight:500;pointer-events:none;font-variant-numeric:tabular-nums;animation:pfloat 3.4s ease-out forwards;z-index:3}
.pfx.gain{color:var(--prim)}.pfx.loss{color:var(--danger)}
@keyframes pfloat{0%{opacity:0;transform:translateY(-50%)}12%{opacity:1}75%{opacity:1}100%{opacity:0;transform:translateY(-190%)}}
.prow{transition:background .3s}
.prow.f-loss{background:var(--lossbg)}.prow.f-loss .num{color:var(--danger)}
.prow.f-gain{background:var(--primbg)}.prow.f-gain .num{color:var(--prim)}
.tile.mort .strip,.tile.mort .own,.tile.mort svg.ic{opacity:.28}
.mtag{font-style:normal;font-size:10.5px;color:var(--mu);margin-left:5px}
.brow{grid-template-columns:minmax(0,1fr) auto auto auto auto}
.brow .mbtn{width:auto;padding:0 8px;font-size:12px}
.brow .qsbtn{grid-column:1/-1;width:100%;min-height:28px;border-style:dashed;color:var(--prim)}
.vsr.turbo{background:var(--lossbg);color:var(--danger)}
.bcost{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:11.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.bc-out{color:var(--danger)}.bc-in{color:var(--prim)}
.debt{border:1px solid var(--danger);background:var(--lossbg);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;line-height:1.5}
.debt b{font-weight:500;color:var(--danger)}
.debt .two{margin-top:10px}
.danger-btn{width:100%;margin-top:8px;color:var(--danger);border-color:var(--danger);background:transparent}
.supply{font-size:12px;color:var(--mu);margin-top:12px;font-variant-numeric:tabular-nums}
.prow.tap{cursor:pointer}
.prow.tap:hover{background:var(--tint)}
.modeseg{display:grid;grid-template-columns:1fr 1fr;margin-bottom:6px}
.modeseg button{min-height:36px;font-size:13px}
.order-row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:0.5px solid var(--line);font-size:15px;min-height:46px}
.order-row:last-of-type{border-bottom:none}
.order-n{width:36px;color:var(--mu);font-variant-numeric:tabular-nums;font-size:13px}
.order-row .fl{color:var(--mu)}
.modeseg{grid-template-columns:1fr 1fr}
.netdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--prim);flex:none}
.netdot.off{background:var(--line2)}
.ntag{font-size:11px;color:var(--mu);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.codebox{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-radius:8px;background:var(--tint);margin-bottom:6px}
.code{font-size:28px;font-weight:500;letter-spacing:.18em;font-variant-numeric:tabular-nums}
.lrow{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:0.5px solid var(--line);font-size:14px}
.lrow .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow button{min-height:30px;padding:4px 10px;font-size:12.5px}
.joinrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.joinrow input{text-transform:uppercase;letter-spacing:.14em}
.banner{border:0.5px solid var(--line2);background:var(--tint);border-radius:8px;padding:8px 10px;font-size:12.5px;text-align:center}
.chat-h{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:8px}
.chat-h b{font-weight:500;letter-spacing:.1em}
.chat-list{max-height:180px;min-height:48px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;font-size:13px;line-height:1.4;padding:2px 0 8px}
.chat-list .cm{display:flex;gap:7px;align-items:baseline;min-width:0}
.chat-list .cm .dot{width:8px;height:8px;border-width:1px}
.chat-list .cm>span{min-width:0;overflow-wrap:anywhere}
.chat-list .cn{color:var(--mu)}
.chat-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;font-size:13.5px}
.set-row .seg button{min-width:58px}
.rules h3{font-size:14px;font-weight:500;margin:18px 0 4px}
.rules h3:first-of-type{margin-top:4px}
.rules p,.rules li{font-size:13px;line-height:1.55;margin:4px 0}
.rules ul{padding-left:18px;margin:4px 0}
.rules .rt{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}
.rules .rt td,.rules .rt th{padding:5px 4px;border-bottom:0.5px solid var(--line);text-align:left;font-weight:400}
.rules .rt th{color:var(--mu);font-size:11.5px}
.rules .rt td:last-child,.rules .rt th:last-child{text-align:right}
.rules .rt i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.tok.cur{width:15px;height:15px;z-index:3;box-shadow:0 0 0 2px var(--tile),0 0 0 4.5px var(--pc),0 2px 6px rgba(0,0,0,.45)}
.trail{position:absolute;inset:0;background:var(--pc);opacity:0;pointer-events:none;z-index:1;animation:trail 1.7s ease-out forwards}
@keyframes trail{0%{opacity:.6}100%{opacity:0}}
.rxbar{display:flex;justify-content:flex-end;margin-top:10px;position:relative}
.rxbtn{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--panel);border-color:var(--line)}
.rxbtn svg{width:17px;height:17px}
.rxbtn[aria-expanded="true"]{border-color:var(--tx)}
.rxpop{position:absolute;right:0;bottom:calc(100% + 6px);z-index:8;display:grid;grid-template-columns:repeat(5,44px);gap:4px;padding:6px;border-radius:12px;background:var(--raised);border:0.5px solid var(--line2);box-shadow:0 6px 20px rgba(0,0,0,.18);animation:rxpop .15s ease-out}
.rxpop button{padding:0;width:44px;height:44px;font-size:22px;line-height:1;background:transparent;border:none;border-radius:8px}
.rxpop button:hover{background:var(--tint)}
.rxpop button:active{transform:scale(.9)}
.rx{position:absolute;z-index:6;font-size:22px;line-height:1;pointer-events:none;transform:translate(-50%,-50%);animation:rxup 1.9s ease-out forwards;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
@keyframes rxup{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}12%{opacity:1;transform:translate(-50%,-80%) scale(1.15)}22%{transform:translate(-50%,-90%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
.rxb{font-size:15px;line-height:1;animation:rxpop .25s ease-out}
@keyframes rxpop{from{transform:scale(.5)}to{transform:none}}
@media (prefers-reduced-motion: reduce){.rx{animation:rxfade 1.9s ease-out forwards}@keyframes rxfade{0%,80%{opacity:1;transform:translate(-50%,-90%)}100%{opacity:0;transform:translate(-50%,-90%)}}}
.buyhl{position:absolute;inset:0;z-index:1;pointer-events:none;border:2px solid var(--pc);border-radius:2px;background:color-mix(in srgb,var(--pc) 32%,transparent);animation:buyhl 3s ease-out forwards}
@keyframes buyhl{0%{opacity:0}8%{opacity:1}20%{opacity:.45}32%{opacity:1}44%{opacity:.45}56%{opacity:1}100%{opacity:0}}
.cbub{position:absolute;z-index:7;max-width:62%;padding:6px 9px;border-radius:10px;background:var(--raised);color:var(--tx);border:1.5px solid var(--pc);font-size:12.5px;line-height:1.35;box-shadow:0 4px 12px rgba(0,0,0,.16);pointer-events:none;overflow-wrap:anywhere;animation:cbub 4.4s ease-out forwards}
@keyframes cbub{0%{opacity:0;transform:translateY(4px) scale(.96)}6%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
.pop-ring{position:absolute;z-index:8;border:3px solid var(--pc);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);animation:popring .8s ease-out forwards}
@keyframes popring{0%{width:12px;height:12px;opacity:1}100%{width:120px;height:120px;opacity:0;border-width:1px}}
.pop-spark{position:absolute;z-index:8;width:7px;height:7px;border-radius:50%;background:var(--pc);box-shadow:0 0 0 1.5px var(--panel);pointer-events:none;transform:translate(-50%,-50%);animation:spark .75s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes spark{0%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.4)}}
.pop-badge{position:absolute;z-index:9;display:flex;align-items:center;gap:4px;white-space:nowrap;pointer-events:none;background:var(--pc);color:#1c1c1c;font-weight:600;font-size:11.5px;letter-spacing:.06em;padding:5px 9px 5px 7px;border-radius:999px;box-shadow:0 0 0 2px var(--panel),0 6px 16px rgba(0,0,0,.28);transform:translate(-50%,-50%);animation:popbadge 2.1s cubic-bezier(.2,1.4,.4,1) forwards}
.pop-badge svg{width:13px;height:13px}
@keyframes popbadge{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}16%{opacity:1;transform:translate(-50%,-95%) scale(1.3)}28%{transform:translate(-50%,-95%) scale(1)}78%{opacity:1;transform:translate(-50%,-115%)}100%{opacity:0;transform:translate(-50%,-160%)}}
.tile.popt{animation:tilepop .5s cubic-bezier(.2,1.6,.4,1);z-index:6}
@keyframes tilepop{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.pop-ring,.pop-spark{display:none}.tile.popt{animation:none}.pop-badge{animation:rxfade 2.1s ease-out forwards}}
.armed{background:var(--lossbg)!important;border-color:var(--danger)!important;color:var(--danger)!important;animation:armp .7s ease-in-out infinite alternate}
@keyframes armp{to{box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 28%,transparent)}}
.stamp{position:absolute;z-index:9;pointer-events:none;white-space:nowrap;font-weight:600;font-size:12px;letter-spacing:.14em;padding:4px 9px;border:2.5px solid currentColor;border-radius:4px;background:color-mix(in srgb,var(--panel) 88%,transparent);box-shadow:0 4px 14px rgba(0,0,0,.22);transform:translate(-50%,-50%) rotate(-12deg);animation:stamp 2.3s cubic-bezier(.2,.9,.3,1.2) forwards}
.stamp.mort{color:var(--danger)}.stamp.lift{color:var(--prim)}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(2.8)}13%{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(.9)}20%{transform:translate(-50%,-50%) rotate(-12deg) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}}
.tile.shake{animation:tshake .45s ease-in-out;z-index:6}
@keyframes tshake{0%,100%{transform:none}20%{transform:translateX(-3px) rotate(-4deg)}40%{transform:translateX(3px) rotate(4deg)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
.drop-badge{position:absolute;z-index:9;display:flex;align-items:center;gap:4px;white-space:nowrap;pointer-events:none;background:var(--lossbg);color:var(--danger);border:1.5px solid var(--danger);font-weight:600;font-size:11.5px;letter-spacing:.06em;padding:4px 9px 4px 7px;border-radius:999px;box-shadow:0 0 0 2px var(--panel),0 6px 14px rgba(0,0,0,.22);transform:translate(-50%,-50%);animation:dropb 2.1s ease-in forwards}
.drop-badge svg{width:13px;height:13px}
@keyframes dropb{0%{opacity:0;transform:translate(-50%,-150%) scale(.6)}14%{opacity:1;transform:translate(-50%,-70%) scale(1.12)}24%{transform:translate(-50%,-70%) scale(1)}72%{opacity:1;transform:translate(-50%,-45%)}100%{opacity:0;transform:translate(-50%,50%)}}
.debris{position:absolute;z-index:8;width:6px;height:6px;border-radius:1px;background:var(--bld);box-shadow:0 0 0 1px var(--panel);pointer-events:none;transform:translate(-50%,-50%);animation:debris 1s cubic-bezier(.45,0,1,1) forwards}
@keyframes debris{0%{opacity:1;transform:translate(-50%,-50%) rotate(0)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot))}}
.tile.sink{animation:tsink .5s ease-out;z-index:6}
@keyframes tsink{0%{transform:none}35%{transform:scale(.78)}100%{transform:none}}
@media (prefers-reduced-motion: reduce){.debris{display:none}.tile.shake,.tile.sink{animation:none}.stamp,.drop-badge{animation:rxfade 2.2s ease-out forwards}}
.flip{perspective:900px;height:100%;max-height:205px;aspect-ratio:5/7;max-width:100%}
.flip-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:slideflip 1.35s cubic-bezier(.3,.7,.25,1) both}
.flip-in>.card{position:absolute;inset:0;height:100%;max-height:none;width:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;animation:none}
.flip-in>.cback{transform:rotateY(180deg)}
@keyframes slideflip{0%{transform:translateX(150%) rotateZ(10deg) rotateY(180deg)}30%{transform:translateX(0) rotateZ(0) rotateY(180deg)}52%{transform:translateX(0) rotateZ(0) rotateY(180deg) scale(1.04)}100%{transform:translateX(0) rotateZ(0) rotateY(0) scale(1)}}
.cback{display:flex;align-items:center;justify-content:center}
.cb-in{position:absolute;inset:8px;border:1.5px solid currentColor;border-radius:7px;opacity:.9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:8px}
.cb-in svg{width:46%;max-width:72px;height:auto}
.cb-in svg{stroke-width:1.5}
.cb-name{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;line-height:1.3}
.turnban{position:absolute;left:50%;top:50%;z-index:10;display:flex;align-items:center;gap:9px;padding:11px 18px;border-radius:14px;background:var(--card);color:var(--tx);box-shadow:var(--cardsh);border:2px solid var(--pc);font-size:17px;font-weight:600;white-space:nowrap;pointer-events:none;transform:translate(-50%,-50%);animation:turnban 2s cubic-bezier(.2,.9,.3,1) forwards}
.turnban i{width:14px;height:14px;border-radius:50%;background:var(--pc);border:1.5px solid var(--tx);flex:none}
@keyframes turnban{0%{opacity:0;transform:translate(-130%,-50%)}14%{opacity:1;transform:translate(-50%,-50%)}80%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(30%,-50%)}}
@media (prefers-reduced-motion: reduce){.turnban{animation:rxfade 2s ease-out forwards}}
.phead{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mu);padding:0 8px 6px;letter-spacing:.02em}
.gtime{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;color:var(--tx);background:var(--tint);border-radius:999px;padding:3px 9px 3px 7px}
.gtime svg{width:13px;height:13px;color:var(--mu)}
.center{position:relative}
.center>*:not(.wm){position:relative;z-index:1}
.wm{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);z-index:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:62%;text-align:center;color:var(--tx);opacity:var(--wmo);}
.wm svg:not(.wmflag){width:30%;max-width:70px;height:auto}
.wm{opacity:calc(var(--wmo)*2.2)}
.wm div{font-size:11px;line-height:1.35;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.land{display:flex;flex-direction:column;align-items:center;gap:5px;margin-top:2px}
.land svg{width:46px;height:46px;color:var(--tx);stroke-width:1.5}
.landic{display:flex}
.landic svg{width:46px;height:46px;stroke-width:2;color:inherit}
.land-n{font-size:13.5px;font-weight:600;text-align:center}
/* ---------- one visual language ----------
   controls 8px · panels 12px · overlays 12px · pills 999px
   every floating thing: 1.5px border, the same soft shadow, weight 600 */
button,input,.seg,.chip,.cash,.die,.prow,.icon-btn{border-radius:8px}
.panel{border-radius:12px}
.card{border-radius:12px}
.cb-in{border-radius:8px}
.result,.debt,.tprev,.codebox{border-radius:10px}
.badge{border-radius:6px}
.tb{display:flex;align-items:center;gap:5px;font-size:12.5px;background:transparent;border-color:var(--line);min-height:32px;padding:5px 10px}
.tb svg,.back svg{flex:none}
.back{min-height:32px}
.fxpill{border-width:1.5px;box-shadow:var(--popsh);font-weight:600;font-size:13px;letter-spacing:.01em}
.pop-badge,.drop-badge{font-weight:600;font-size:11.5px;letter-spacing:.08em;box-shadow:0 0 0 2px var(--panel),var(--popsh)}
.drop-badge{border-width:1.5px}
.stamp{font-weight:600;letter-spacing:.1em;border-width:2px;border-radius:6px;box-shadow:var(--popsh)}
.cbub{border-width:1.5px;border-radius:12px;box-shadow:var(--popsh)}
.turnban{border-width:1.5px;border-radius:12px;box-shadow:var(--popsh);font-size:16px}
.rxpop{border-radius:12px;box-shadow:var(--popsh)}
.cb-name,.wm div{letter-spacing:.1em}
.rxbtn{background:transparent;border-color:var(--line)}
.gtime{font-size:12px}
.board.bshake{animation:bshake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes bshake{10%,90%{transform:translate(-1px,1px)}20%,80%{transform:translate(3px,-1px)}30%,50%,70%{transform:translate(-5px,2px)}40%,60%{transform:translate(5px,-2px)}}
.dropw{position:absolute;z-index:11;pointer-events:none;animation:dropfall .56s cubic-bezier(.55,0,.95,.45) both}
@keyframes dropfall{from{transform:translateY(var(--fall))}to{transform:translateY(0)}}

/* ================= final look =================
   one system for every screen: 4/8px spacing · radii 8/12/16 · two shadows ·
   five type steps · 44px tap targets · one easing curve.
   Colors: neutral surfaces, blue = primary action, green = money in,
   red = money out / danger, shield blue, town colors. */
:root{
  --page:#efede8; --panel:#ffffff; --tile:#f4f3ef; --raised:#ffffff; --tint:#f3f1ec; --line:#e4e1da; --line2:#cbc8c0;
  --tx:#17181a; --mu:#6b6964; --sig:#8a8780;
  --prim:#2347c6; --pbg:#2347c6; --pfg:#ffffff; --pbd:#2347c6; --primbg:#e8edfb;
  --gain:#167a4a; --gainbg:#e2f3e9; --danger:#c2372d; --lossbg:#fbe9e6;
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px;
  --r1:8px; --r2:12px; --r3:16px;
  --sh1:0 1px 2px rgba(23,24,26,.06),0 0 0 1px rgba(23,24,26,.05);
  --sh2:0 14px 34px rgba(23,24,26,.18),0 2px 8px rgba(23,24,26,.08);
  --popsh:var(--sh2);
  --ease:cubic-bezier(.2,.8,.2,1); --dur:.2s;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0d0e10; --panel:#17181b; --tile:#202125; --raised:#1f2024; --tint:#1f2024; --line:#2b2c31; --line2:#45464d;
  --tx:#f1f1f3; --mu:#9c9da3; --sig:#7d7e84;
  --prim:#93b2ff; --pbg:#8eaeff; --pfg:#0a1638; --pbd:#8eaeff; --primbg:#1a2340;
  --gain:#62d39b; --gainbg:#14281e; --danger:#ff8b80; --lossbg:#33201e;
  --sh1:0 0 0 1px rgba(255,255,255,.06);
  --sh2:0 18px 44px rgba(0,0,0,.62),0 0 0 1px rgba(255,255,255,.06);}}
:root[data-theme="dark"]{
  --page:#0d0e10; --panel:#17181b; --tile:#202125; --raised:#1f2024; --tint:#1f2024; --line:#2b2c31; --line2:#45464d;
  --tx:#f1f1f3; --mu:#9c9da3; --sig:#7d7e84;
  --prim:#93b2ff; --pbg:#8eaeff; --pfg:#0a1638; --pbd:#8eaeff; --primbg:#1a2340;
  --gain:#62d39b; --gainbg:#14281e; --danger:#ff8b80; --lossbg:#33201e;
  --sh1:0 0 0 1px rgba(255,255,255,.06);
  --sh2:0 18px 44px rgba(0,0,0,.62),0 0 0 1px rgba(255,255,255,.06);}

/* base */
body{font-size:14px;line-height:1.4;padding-inline:var(--sp4);padding-block:var(--sp3) 40px;-webkit-font-smoothing:antialiased}
.app{gap:var(--sp4)}
button{min-height:44px;padding:0 var(--sp3);border-radius:var(--r1);border:1px solid var(--line2);background:var(--panel);font-weight:500;
  transition:background-color var(--dur) var(--ease),border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease),transform .12s var(--ease)}
button:active:not(:disabled){transform:scale(.97)}
button.pr{background:var(--pbg);border-color:var(--pbd);color:var(--pfg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.14)}
button.pr:active:not(:disabled){filter:brightness(.92)}
button:disabled{opacity:.38;box-shadow:none}
button:focus-visible,input:focus-visible,[data-act]:focus-visible{outline:2px solid var(--prim);outline-offset:2px}
button.ghost{border-color:transparent;background:transparent}
input{height:44px;border-radius:var(--r1);border:1px solid var(--line2);background:var(--raised);padding:0 var(--sp3)}
.panel{background:var(--panel);border:0;border-radius:var(--r3);padding:var(--sp4);box-shadow:var(--sh1)}
.lbl{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mu);margin:var(--sp5) 0 var(--sp2)}
.err:empty{min-height:0;margin:0}
.hint{font-size:12.5px}

/* header */
.top{min-height:44px}
.prflag{width:28px;height:28px}
.logo{font-size:21px}
.top-acts{gap:var(--sp2)}
.icon-btn{width:40px;min-height:40px;height:40px;border:0;background:var(--panel);box-shadow:var(--sh1);border-radius:var(--r2)}

/* view headers: back · title · one tool, nothing truncates */
.vhead{gap:var(--sp2);margin-bottom:var(--sp4);min-height:40px}
.vhead h2{font-size:19px;font-weight:600;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back,.tb{min-height:40px;border:0;background:var(--tint);border-radius:999px}
.back{padding:0 14px 0 8px;font-weight:500}
.vhead .tb{width:40px;padding:0;justify-content:center;font-size:0;gap:0;flex:none}
.vhead .tb svg{width:18px;height:18px}
.vhead>.who{flex:none;padding:0 4px}
.vhead>.who .num{font-weight:600}

/* segmented controls */
.seg{border:0;background:var(--tint);border-radius:var(--r1);padding:3px;gap:2px}
.seg button{min-height:36px;border-radius:6px;font-size:13px;padding:0 12px}
.seg button.on{background:var(--panel);box-shadow:var(--sh1);font-weight:600}
.modeseg{margin-bottom:var(--sp3)}.modeseg button{min-height:40px}
.set-row{padding:var(--sp2) 0;min-height:52px}
.vshint{border-radius:var(--r2);padding:var(--sp3);font-size:12.5px;margin:0 0 var(--sp2)}

/* board: a framed table with flat tiles */
.board{padding:6px;gap:2px;background:var(--panel);border-radius:var(--r3);box-shadow:var(--sh1)}
.tile{border:0;border-radius:3px;background:var(--tile)}
.tile.prop{background:color-mix(in srgb,var(--gc) 20%,var(--tile));border:0}
.tile.deck{background:color-mix(in srgb,var(--gc) 30%,var(--tile));border:0}
.tile.hit{outline:2px solid var(--tx);outline-offset:-2px}
.own{width:6px;height:6px;box-shadow:0 0 0 1.5px var(--panel)}
.center{border:0;border-radius:var(--r2);background:var(--tint);padding:var(--sp3);gap:var(--sp2);font-size:13px}
.center .c-row{min-height:24px}
.center .c-row>.mu:first-child{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.dice{gap:var(--sp2);margin:0}

.center>.c-row{order:0}

/* ================= "Consola" skin (opt-in from Settings) =================
   monospace, ink on near-black, dotted hairlines, square corners, inverted selections */
:root[data-skin="term"]{
  --f:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --page:#ecebe4; --panel:#ecebe4; --tile:#e3e2da; --raised:#ecebe4; --tint:#e3e2da; --line:#9b9a93; --line2:#55544f;
  --tx:#141414; --mu:#5d5c57; --pbg:#141414; --pfg:#ecebe4; --pbd:#141414; --prim:#141414; --primbg:#d6d5cd;
  --gain:#1d6b3f; --gainbg:#d9e6dc; --danger:#a3291f; --lossbg:#ecd9d5;
  --sh1:none; --sh2:none; --popsh:none; --dot:1.5px dotted var(--line2);
}
@media (prefers-color-scheme: dark){:root[data-skin="term"]:not([data-theme="light"]){
  --page:#141414; --panel:#141414; --tile:#1b1b1a; --raised:#141414; --tint:#1b1b1a; --line:#4a4945; --line2:#8a8983;
  --tx:#ecebe4; --mu:#8e8c85; --pbg:#ecebe4; --pfg:#141414; --pbd:#ecebe4; --prim:#ecebe4; --primbg:#2a2a28;
  --gain:#8fd4a8; --gainbg:#1d2a22; --danger:#ff9c8f; --lossbg:#2e1f1d; --shield:#8fb8ff}}
:root[data-skin="term"][data-theme="dark"]{
  --page:#141414; --panel:#141414; --tile:#1b1b1a; --raised:#141414; --tint:#1b1b1a; --line:#4a4945; --line2:#8a8983;
  --tx:#ecebe4; --mu:#8e8c85; --pbg:#ecebe4; --pfg:#141414; --pbd:#ecebe4; --prim:#ecebe4; --primbg:#2a2a28;
  --gain:#8fd4a8; --gainbg:#1d2a22; --danger:#ff9c8f; --lossbg:#2e1f1d; --shield:#8fb8ff}
[data-skin="term"] body{font-family:var(--f);letter-spacing:.02em}
[data-skin="term"] :is(button,input,.panel,.seg,.seg button,.center,.board,.tile,.actc,.ac-ic,.chip,.cash,.tside,.town,.icon-btn,.back,.tb,.prow,.log li,.hcard,.vsr,.gtime,.card,.codebox,.result,.debt,.badge,.partners button,.balbub,.rxbar>button,.die,.tgtlist button,.vshint,.rv-step,.rv-card,.rv-chip,.lrow,.order-row,.qsbtn,.hmore,.sbpop,.rxpop,.fxpill,.stamp,.status.note){border-radius:0!important;box-shadow:none!important}
[data-skin="term"] :is(button,input,.panel,.seg,.center,.actc,.chip,.cash,.tside,.town,.icon-btn,.tgtlist button,.vshint,.rv-step,.rv-card,.balbub,.card,.codebox,.result){border:var(--dot)!important}
[data-skin="term"] .board{background:transparent;border:0;padding:0;gap:3px}
[data-skin="term"] .tile{background:transparent;border:1px dotted var(--line)!important}
[data-skin="term"] .tile.prop{background:color-mix(in srgb,var(--gc) 10%,transparent)}
[data-skin="term"] .tile.deck{background:color-mix(in srgb,var(--gc) 16%,transparent)}

[data-skin="term"] .seg{background:transparent;padding:0;gap:0}
[data-skin="term"] .seg button{border:0!important;border-right:var(--dot)!important;background:transparent}
[data-skin="term"] .seg button:last-child{border-right:0!important}
[data-skin="term"] :is(.seg button.on,button.pr,.partners button.on,.tside .chip.on,.rxbar>button[aria-expanded="true"]){background:var(--tx)!important;color:var(--page)!important;border-style:solid!important}
[data-skin="term"] :is(button,.lbl,.phead,.hhead,.ac-cap,.center .c-row>.mu:first-child,.vsr,.town-h,.rules h3){text-transform:uppercase;letter-spacing:.1em}
[data-skin="term"] button{font-weight:500;font-size:13px}
[data-skin="term"] .vhead h2,[data-skin="term"] .logo{font-family:var(--f);letter-spacing:.04em;font-weight:600}
[data-skin="term"] .prflag rect{fill:var(--tx)}
[data-skin="term"] .panel{background:transparent}
[data-skin="term"] .prow.cur,[data-skin="term"] .log li:first-child{background:transparent;outline:1.5px dotted var(--line2);outline-offset:-1.5px}
[data-skin="term"] .tside,[data-skin="term"] .town,[data-skin="term"] .vshint{background:transparent}

[data-skin="term"] .icon-btn{background:transparent}
[data-skin="term"] .cash input{border:0!important}

/* ---------- Consola · studio-grade layer ---------- */
:root[data-skin="term"]{--dur:.14s;--ease:cubic-bezier(.3,0,.2,1);--cell:8px}

[data-skin="term"] .board{gap:4px}

<script>

/* ---------- online outside claude.ai ----------
   PeerJS links every phone straight to the host's phone. The host relays everything,
   so the rest of the game talks to the same room shape it uses on claude.ai. */
const SA_PFX='boripoly-v1-';
function lsDb(){const K='bp-db:',rd=k=>{try{const v=localStorage.getItem(K+k);return v?JSON.parse(v):null}catch(_){return null}};
  const doc=path=>({get:async()=>{const v=rd(path);return{exists:v!=null,data:()=>v}},set:async v=>{try{localStorage.setItem(K+path,JSON.stringify(v))}catch(_){}}});
  return{doc,collection:c=>({where:(f,op,val)=>({get:async()=>{const docs=[];
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(K+c+'/')){const v=rd(k.slice(K.length));if(v&&v[f]===val)docs.push({data:()=>v})}}
    return{docs}}})})}}

/* list of open rooms: whichever phone holds the well-known directory id keeps the list.
   If it leaves, the next phone that looks takes the id over; hosts re-announce every few seconds. */
function makeDir(){
  const DID=SA_PFX+'dir',TTL=15000;
  let cb=null,started=false,list=[],have=false,heard=0,mine=null,cli=null,conn=null,dir=null,isDir=false,rooms={},clients=new Map(),busy=false;
  const tell=()=>{if(cb)try{cb()}catch(_){}};
  const clean=v=>typeof cleanLob==='function'?cleanLob(v):v;
  const pub=()=>{const t=Date.now();for(const k in rooms)if(t-rooms[k].ts>TTL)delete rooms[k];return Object.values(rooms).map(x=>x.info)};
  const push=()=>{if(!isDir)return;list=pub();have=true;for(const c of clients.values())if(c.open)try{c.send({t:'list',rooms:list})}catch(_){}tell()};
  const later=f=>setTimeout(f,400+Math.random()*1200);
  function becomeDir(){
    if(isDir||busy)return;busy=true;
    let d;try{d=new Peer(DID,{debug:0})}catch(_){busy=false;return later(link)}
    d.on('open',()=>{busy=false;isDir=true;dir=d;if(cli){try{cli.destroy()}catch(_){}cli=null;conn=null}
      if(mine)rooms[mine.code]={info:mine,ts:Date.now(),cc:'self'};
      d.on('connection',c=>{const id=c.connectionId||c.peer;clients.set(id,c);
        c.on('open',()=>{try{c.send({t:'list',rooms:pub()})}catch(_){}});
        c.on('data',m=>{if(!m||typeof m!=='object')return;
          if(m.t==='ann'){const info=clean(m.info);if(info){rooms[info.code]={info,ts:Date.now(),cc:id};push()}}
          else if(m.t==='del'){const k=String(m.code||'');if(rooms[k]&&rooms[k].cc===id){delete rooms[k];push()}}});
        c.on('close',()=>{clients.delete(id);for(const k in rooms)if(rooms[k].cc===id)delete rooms[k];push()});c.on('error',()=>{})});
      push()});
    d.on('error',e=>{if(isDir)return;busy=false;try{d.destroy()}catch(_){}later(link)});
    d.on('disconnected',()=>{try{if(!d.destroyed)d.reconnect()}catch(_){}});
  }
  function link(){
    if(isDir||busy)return;
    if(cli&&!cli.destroyed&&!cli.disconnected){dial();return}
    try{cli=new Peer(undefined,{debug:0})}catch(_){return}
    cli.on('open',dial);
    cli.on('error',e=>{if(e&&e.type==='peer-unavailable'){conn=null;becomeDir()}});
    cli.on('disconnected',()=>{try{if(cli&&!cli.destroyed)cli.reconnect()}catch(_){}});
  }
  function dial(){
    if(isDir||!cli)return;const c=cli.connect(DID,{reliable:true});conn=c;heard=Date.now();
    c.on('open',()=>{heard=Date.now();if(mine)c.send({t:'ann',info:mine})});
    c.on('data',m=>{heard=Date.now();if(m&&m.t==='list'&&Array.isArray(m.rooms)){list=m.rooms.map(clean).filter(Boolean);have=true;tell()}});
    c.on('close',()=>{if(conn===c){conn=null;have=false;later(link)}});c.on('error',()=>{});
  }
  setInterval(()=>{if(!started)return;
    if(isDir){if(mine)rooms[mine.code]={info:mine,ts:Date.now(),cc:'self'};push()}
    else if(conn&&Date.now()-heard>12000){const c=conn;conn=null;have=false;try{c.close()}catch(_){}later(link)}
    else if(conn&&conn.open){if(mine)conn.send({t:'ann',info:mine})}
    else if(!busy&&(!cli||!conn))link()},5000);
  return{
    start(f){cb=f;if(!started){started=true;link()}},
    rooms(){return (isDir?pub():list).filter(l=>!mine||l.code!==mine.code)},
    ready(){return have},
    announce(info){const old=mine;mine=info?clean(info):null;if(!started){started=true;link()}
      if(isDir){if(old&&(!mine||old.code!==mine.code))delete rooms[old.code];if(mine)rooms[mine.code]={info:mine,ts:Date.now(),cc:'self'};push()}
      else if(conn&&conn.open){if(mine)conn.send({t:'ann',info:mine});else if(old)conn.send({t:'del',code:old.code})}}
  };
}
function peerRoom(){return{join:(name,host)=>peerJoin(name,!!host)}}
function peerJoin(name,host){
  return new Promise((res,rej)=>{
    if(typeof Peer!=='function')return rej({code:'nopeer'});
    const hostId=SA_PFX+name,subs={},psubs=new Set(),conns=new Map();
    let peers=[],closed=false,live=false,hconn=null;
    const me={by:MYCID,kind:'viewer',presence:{},connId:'host'};
    const deliver=(topic,data,by)=>{const m={topic,data,by,isMe:by===MYCID,sameTab:by===MYCID,kind:'viewer'};
      (subs[topic]||[]).slice().forEach(f=>{try{f(m)}catch(e){console.error(e)}})};
    const setPeers=list=>{const old=peers;peers=(Array.isArray(list)?list:[]).map(x=>({...x,kind:'viewer',isMe:x.by===MYCID,sameTab:x.by===MYCID}));
      const oi=new Set(old.map(x=>x.connId)),ni=new Set(peers.map(x=>x.connId));
      const ch={peers:peers.slice(),joined:peers.filter(x=>!oi.has(x.connId)),left:old.filter(x=>!ni.has(x.connId)),updated:peers.filter(x=>oi.has(x.connId))};
      psubs.forEach(f=>{try{f(ch)}catch(e){console.error(e)}})};
    const roster=()=>[{by:MYCID,presence:{...me.presence},connId:'host'}].concat([...conns.values()].filter(c=>c.ready).map(c=>({by:c.cid,presence:{...c.presence},connId:c.id})));
    const bcast=(msg,except)=>{for(const c of conns.values())if(c.ready&&c.id!==except&&c.conn.open)try{c.conn.send(msg)}catch(_){}};
    const pushPeers=()=>{const list=roster();bcast({t:'peers',list});setPeers(list)};
    const peer=new Peer(host?hostId:undefined,{debug:0});
    const fail=code=>{if(live||closed)return;closed=true;try{peer.destroy()}catch(_){}rej({code})};
    peer.on('error',e=>{const t=e&&e.type;if(!live)fail(t==='peer-unavailable'?'no_game':t==='unavailable-id'?'taken':'network')});
    peer.on('disconnected',()=>{if(!closed)setTimeout(()=>{try{if(!closed&&peer.disconnected)peer.reconnect()}catch(_){}},1500)});
    peer.on('open',()=>{
      if(host){
        live=true;
        peer.on('connection',conn=>{
          const c={id:conn.connectionId||conn.peer,conn,cid:null,presence:{},ready:false};conns.set(c.id,c);
          conn.on('data',msg=>{if(!msg||typeof msg!=='object')return;
            if(msg.t==='hello'){c.cid=String(msg.cid||c.id).slice(0,64);c.presence=msg.presence&&typeof msg.presence==='object'?msg.presence:{};c.ready=true;pushPeers();return}
            if(!c.ready)return;
            if(msg.t==='ev'&&typeof msg.topic==='string'){bcast({t:'ev',topic:msg.topic,data:msg.data,by:c.cid},c.id);deliver(msg.topic,msg.data,c.cid)}
            else if(msg.t==='pres'&&msg.patch&&typeof msg.patch==='object'){for(const[k,v]of Object.entries(msg.patch)){if(v===null)delete c.presence[k];else c.presence[k]=v}pushPeers()}});
          conn.on('close',()=>{if(conns.delete(c.id))pushPeers()});conn.on('error',()=>{});
        });
        setPeers(roster());res(api);
      }else{
        hconn=peer.connect(hostId,{reliable:true});
        hconn.on('open',()=>{live=true;hconn.send({t:'hello',cid:MYCID,presence:me.presence});res(api)});
        hconn.on('data',msg=>{if(!msg||typeof msg!=='object')return;if(msg.t==='ev')deliver(msg.topic,msg.data,msg.by);else if(msg.t==='peers')setPeers(msg.list)});
        hconn.on('close',()=>{if(!closed)setPeers([])});hconn.on('error',()=>{});
        setTimeout(()=>fail('no_game'),15000);
      }
    });
    const api={
      peers:()=>peers.slice(),
      onPeers:f=>{psubs.add(f);setTimeout(()=>{if(psubs.has(f))f({peers:peers.slice(),joined:peers.slice(),left:[],updated:[]})},0);return()=>psubs.delete(f)},
      on:(topic,f)=>{(subs[topic]=subs[topic]||[]).push(f);return()=>{subs[topic]=(subs[topic]||[]).filter(x=>x!==f)}},
      emit:async(topic,data)=>{
        if(closed)throw{code:'closed'};const d=data==null?null:JSON.parse(JSON.stringify(data));
        if(host)bcast({t:'ev',topic,data:d,by:MYCID});
        else if(hconn&&hconn.open)hconn.send({t:'ev',topic,data:d});
        else throw{code:'disconnected'};
        setTimeout(()=>deliver(topic,d,MYCID),0);
      },
      presence:async patch=>{for(const[k,v]of Object.entries(patch||{})){if(v===null)delete me.presence[k];else me.presence[k]=v}
        if(host)pushPeers();else if(hconn&&hconn.open)hconn.send({t:'pres',patch});},
      connected:()=>!closed&&(host?!peer.disconnected||conns.size>0:!!(hconn&&hconn.open)),
      leave:async()=>{closed=true;try{peer.destroy()}catch(_){}}
    };
  });
}

  if(!PF(p).noMort)for(const g in GROUPS){if(!ownsAll(p.i,g)||TOWN[g].some(k=>S.mort[k])||S.supply.off<TOWN[g].length)continue;

  while(guard++<24){
    const opts=[];

    /* best rent gained per dollar; the jump to 3 pisos is the sweet spot */
    const sc=k=>{const t=BOARD[k],n=S.bld[k]||0;return (t.r[n+1]-t.r[n])/bcost(t.g)*(n<3?1.35:1)*(t.g==='au'||t.g==='no'?1.12:1)};

  const lift=Object.keys(S.mort).map(Number).filter(k=>S.own[k]===p.i).sort((a,b)=>worth(p.i,b)-worth(p.i,a));
  for(const k of lift)if(p.cash-unmortCost(k)>=res+350){unmortgage(p,k);render();await wait(300);}
}

      else if(t.t==='rail'){const mine=RAILS.filter(q=>S.own[q]===p.i).length,theirs=RAILS.filter(q=>S.own[q]===o.i).length;ok=mine>=2&&theirs===1;sc=2.2+mine*.2;}

    const bump=S.botBump&&S.botBump[it.key];if(bump&&it.kind!=='sell'){it.give.cash+=r50((it.give.cash||100)*.15*bump);it.cap+=r50(100*bump)}

/* one negotiation; resolves true if a deal went through */
async function botPropose(p,it){
  const O=S.players[it.o],res=reserve(p);S.botAsked[it.key]=S.turnCount;
  const offer={from:p.i,to:it.o,give:it.give,get:it.get,counters:0};
  if(offer.give.cash&&p.cash-offer.give.cash<Math.min(res,200)){const keep=new Set([...offer.get.props,...offer.give.props]);
    await botFund(p,offer.give.cash+Math.min(res,200),keep);if(p.cash-offer.give.cash<Math.min(res,200)){offer.give.cash=Math.floor((p.cash-Math.min(res,200))/50)*50;if(offer.give.cash<=0&&!offer.give.props.length)return false}}
  if(it.kind==='sell')log(`${nm(p)} is short on cash and offers ${esc(BOARD[it.give.props[0]].n)} to ${nm(O)}`);
  else log(`${nm(p)} makes an offer to ${nm(O)}`);
  try{sfx('bid')}catch(_){}botReact(p.i,it.kind==='sell'?['💸','😭']:['🤝','💰'],.35);render();await wait(700);
  if(O.human){const before=JSON.stringify(S.own);(S.humAsk=S.humAsk||{})[it.o]=S.turnCount;
    if(S.online)await botOfferNet(offer);else await new Promise(r=>{NEG={r};openReview(offer)});
    const ok=JSON.stringify(S.own)!==before,B=S.botBump=S.botBump||{},N=S.players.length;
    if(ok)delete B[it.key];
    else if((B[it.key]||0)<2&&it.kind!=='sell'){B[it.key]=(B[it.key]||0)+1;S.botAsked[it.key]=S.turnCount-N*3}  /* back next round with a bit more */
    else{delete B[it.key];S.botAsked[it.key]=S.turnCount+N*2}                                         /* then let it rest */
    return ok}
  for(let round=0;round<3;round++){
    const r=botEval(offer);
    if(r.k==='accept'){execTrade(offer);render();await wait(600);return true}
    if(r.k!=='counter')break;
    if(it.kind==='sell'){const lower=offer.get.cash-r.gap;if(lower<it.floor)break;offer.get.cash=Math.max(it.floor,Math.floor(lower/50)*50);log(`${nm(p)} lowers the price to ${fmt(offer.get.cash)}`);}

async function maybeBotTrade(p,danger=false,need=0){
  if(S.phase==='over'||p.bankrupt)return false;
  if(!danger){S.botTradeN=S.botTradeN||0;if(S.botTradeN>=2)return false}
  let done=false,askedHuman=false;
  for(let tries=0;tries<2;tries++){
    if(danger&&p.cash>=need)break;
    const ideas=tradeIdeas(p,danger,need-p.cash).filter(x=>!(askedHuman&&S.players[x.o].human));if(!ideas.length)break;
    const it=ideas[0];if(!danger)S.botTradeN++;if(S.players[it.o].human)askedHuman=true;  /* one question per human per round, no nagging */

  }

function after(o){const own={...S.own};o.give.props.forEach(k=>own[k]=o.to);o.get.props.forEach(k=>own[k]=o.from);return own}
function botEval(o){
  const b=o.to,other=o.from,own=after(o),me=S.players[b];
  const cashW=me.cash<reserve(me)?1.25:1;            /* cash matters more when we're short */
  let recv=o.give.cash*cashW+o.give.cards.length*50, give=o.get.cash+o.get.cards.length*50;
  let myTown=null;
  o.give.props.forEach(k=>{let v=S.mort[k]?BOARD[k].p/2-fee(k):BOARD[k].p;const g=BOARD[k].g;
    if(g&&ownsAll(b,g,own)){v*=1.8;myTown=g}

    else if(BOARD[k].t==='rail')v*=1+0.2*RAILS.filter(q=>S.own[q]===b).length;
    recv+=v});
  o.get.props.forEach(k=>{let v=S.mort[k]?BOARD[k].p/2:BOARD[k].p;const g=BOARD[k].g;
    if(g&&ownsAll(other,g,own))v*=myTown&&townPower(myTown)>=townPower(g)?1.4:2.3;
    else if(g&&TOWN[g].some(q=>q!==k&&S.own[q]===b))v*=1.2;
    else if(BOARD[k].t==='rail')v*=1+0.2*RAILS.filter(q=>S.own[q]===b).length;
    give+=v});

  if(o.get.cash>0&&cashAfter<Math.min(reserve(me),250))return{k:'decline'};

function chotaFX(p){act({k:'bail',pos:10,by:p.i,amt:-50});p.chota=(p.chota||0)+1;const d={n:p.name,c:p.color,k:p.chota};showChotaPop(d);botSb(p.i,'awkward',.6)||botSb(otherBot(p.i),'awkward',.4);if(S.online&&NET.host&&NET.g)NET.g.emit('fx',{chota:d}).catch(()=>{})}
function execTrade(o){
  const A=S.players[o.from],B=S.players[o.to];
  act({k:'trade',by:A.i,to:B.i});const deal={a:{n:A.name,c:A.color,ch:A.chota||0},b:{n:B.name,c:B.color,ch:B.chota||0},ag:tradeItems(o.give,A),bg:tradeItems(o.get,B)};
  o.give.props.forEach(k=>S.own[k]=B.i);o.get.props.forEach(k=>S.own[k]=A.i);if(S.shield)[...o.give.props,...o.get.props].forEach(k=>delete S.shield[k]);
  const ga=o.give.cards.slice().sort((x,y)=>y-x).map(j=>A.cards.splice(j,1)[0]);
  const gb=o.get.cards.slice().sort((x,y)=>y-x).map(j=>B.cards.splice(j,1)[0]);
  B.cards.push(...ga);A.cards.push(...gb);
  A.cash+=o.get.cash-o.give.cash;B.cash+=o.give.cash-o.get.cash;
  const fb=o.give.props.filter(k=>S.mort[k]).reduce((a,k)=>a+fee(k),0),fa=o.get.props.filter(k=>S.mort[k]).reduce((a,k)=>a+fee(k),0);
  B.cash-=fb;A.cash-=fa;
  let s=describe(o);if(fa||fb)s+=` (mortgage fees: ${[fa?nm(A)+' '+fmt(fa):'',fb?nm(B)+' '+fmt(fb):''].filter(Boolean).join(', ')})`;
  if(!A.human)botSb(A.i,'celebrate',.35)||botReact(A.i,['🤝','📈','👍'],.4);else if(!B.human)botSb(B.i,'celebrate',.35)||botReact(B.i,['🤝','📈','👍'],.4);
  if(fa||fb)deal.fees=(LANG==='es'?'Cuota de hipoteca: ':'Mortgage fees: ')+[fa?A.name+' '+fmt(fa):'',fb?B.name+' '+fmt(fb):''].filter(Boolean).join(', ');
  showTradePop(deal);if(S.online&&NET.host&&NET.g)NET.g.emit('fx',{trade:deal}).catch(()=>{});
  log(s);return s;
}

/* ---------- trade flow ---------- */
function openTrade(from,to,give,get,counters){
  UI.trade={from,to,give:give||emptySel(),get:get||emptySel(),counters:counters||0,result:null};
  UI.screen='trade';render();
}
function validate(T){
  if(!T.give.props.length&&!T.give.cards.length&&!T.give.cash&&!T.get.props.length&&!T.get.cards.length&&!T.get.cash)return'Add something to the offer first.';
  if(T.give.cash>S.players[T.from].cash)return`You only have ${fmt(S.players[T.from].cash)}.`;
  if(T.get.cash>S.players[T.to].cash)return`${nm(S.players[T.to])} only has ${fmt(S.players[T.to].cash)}.`;
  const fTo=T.give.props.filter(k=>S.mort[k]).reduce((a,k)=>a+fee(k),0),fFrom=T.get.props.filter(k=>S.mort[k]).reduce((a,k)=>a+fee(k),0);
  if(S.players[T.from].cash-T.give.cash+T.get.cash-fFrom<0)return`${nm(S.players[T.from])} can't cover the 10% fee on mortgaged properties.`;
  if(S.players[T.to].cash+T.give.cash-T.get.cash-fTo<0)return`${nm(S.players[T.to])} can't cover the 10% fee on mortgaged properties.`;
  return'';
}
function sendTrade(){
  const T=UI.trade,err=validate(T);
  if(err){$('terr').textContent=err;return}
  const offer={from:T.from,to:T.to,give:{...T.give,props:[...T.give.props],cards:[...T.give.cards]},get:{...T.get,props:[...T.get.props],cards:[...T.get.cards]},counters:T.counters};
  const to=S.players[T.to];
  if(!to.human){const r=botEval(offer);
    if(r.k==='accept')T.result={k:'accept',summary:execTrade(offer)};
    else if(r.k==='counter'){T.result={k:'counter',gap:r.gap};T.pending=offer;}
    else T.result={k:'decline'};
    render();return;}
  openReview(offer);
}
function openReview(offer){
  UI.review=offer;
  const humans=active().filter(p=>p.human).length;
  if(humans>1&&!S.solo){UI.pass={to:offer.to,why:`${nm(S.players[offer.from])} has a trade offer for you.`,next:'review'};UI.screen='pass';}
  else UI.screen='review';
  render();
}
function finishNegotiation(){
  UI.trade=null;UI.review=null;
  const p=cur();const humans=active().filter(x=>x.human).length;
  const back=()=>{UI.screen=UI.debt?'manage':'game';if(UI.debt)UI.actor=UI.debt.p;render();if(NEG){const r=NEG.r;NEG=null;r()}};
  if(!UI.debt&&!S.solo&&p.human&&humans>1&&UI.lastViewer!=null&&UI.lastViewer!==p.i){UI.pass={to:p.i,why:'Back to your turn.',next:'game'};UI.screen='pass';UI._after=back;render();}
  else back();
}

/* ---------- sounds ----------
   Every sound the game makes is one named event below. To use your own sounds,
   set a source for an event in SFX_FILES: a data: URI, or the path of an audio
   file published alongside the page (e.g. 'sfx/tap.wav'). Events left as null
   keep the built-in synth sound. Files are loaded the first time the player taps. */
const SFX_FILES={
  tap:null,       // any button press
  step:null,      // token moves one space
  dice:null,      // dice rattle (fires repeatedly while dice spin)
  diceland:null,  // dice settle
  gain:null,      // someone collects money
  loss:null,      // someone pays money
  buy:null,       // property bought or won at auction
  card:null,      // card drawn
  auction:null,   // auction opens
  bid:null,       // new high bid
  turn:null,      // it's your turn
  lockup:null,    // sent to Lockup
  build:null,     // office or HQ built (cash register)
  doubles:null,   // dice come up doubles
  sell:null,      // office or HQ sold
  mortgage:null,  // mortgage taken (stamp)
  unmortgage:null,// mortgage lifted
  offer:null,     // trade offer arrives for you
  deal:null,      // trade goes through
  decline:null,   // your offer is declined
  chat:null,      // chat message from someone else
  send:null,      // your chat message sent
  react:null,     // emoji reaction from any player
  sb_awkward:null, // soundboard: awkward (crickets)
  sb_horror:null,  // soundboard: dark horror drone
  sb_celebrate:null,// soundboard: celebration
  sb_loser:null,   // soundboard: loser (wah-wah)
  sb_sad:null,     // soundboard: sad
  bankrupt:null,  // a company goes bankrupt
  win:null        // game over

  const now=performance.now();if(SND.last[name]&&now-SND.last[name]<(name==='dice'?35:60))return;SND.last[name]=now;
  const t=SND.ctx.currentTime+0.005,b=SND.buf[name];
  try{if(b){const s=SND.ctx.createBufferSource();s.buffer=b;s.connect(SND.master);s.start(t)}else if(SYN[name])SYN[name](t)}catch(_){}
}

  b.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/>${SND.on?'<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>':'<path d="M17 9.5l5 5M22 9.5l-5 5"/>'}</svg>`;
  b.setAttribute('aria-label',SND.on?'Turn sound off':'Turn sound on');b.setAttribute('aria-pressed',String(SND.on))}

function armKey(b){return b.dataset.act+'|'+(b.dataset.i||'')+'|'+(b.dataset.k||'')}
function armBtns(){if(!ARM.key||Date.now()>=ARM.until)return;document.querySelectorAll('[data-confirm]').forEach(x=>{if(armKey(x)===ARM.key){x.classList.add('armed');x.textContent=tr('Tap again to confirm')}})}
function turnBanner(p){
  const bd=$('board');if(!bd||!p||p.bankrupt||UI.screen!=='game')return;
  bd.querySelectorAll('.turnban').forEach(x=>x.remove());
  const b=document.createElement('div');b.className='turnban';b.style.setProperty('--pc',p.color);
  b.innerHTML='<i></i>';b.appendChild(document.createTextNode(mine(p)&&(S.online||S.players.filter(x=>x.human).length===1)?tr('Your turn'):tr(`${p.name}'s turn`)));
  bd.appendChild(b);setTimeout(()=>b.remove(),2050);
}
function fxSpot(k){const tl=tiles[k],bd=$('board');if(!tl||!bd||UI.screen!=='game')return null;return{tl,bd,cx:tl.offsetLeft+tl.offsetWidth/2,cy:tl.offsetTop+tl.offsetHeight/2}}
function fxEl(sp,cls,css,ms){const e=document.createElement('div');e.className=cls;e.style.cssText=`left:${sp.cx}px;top:${sp.cy}px;`+(css||'');sp.bd.appendChild(e);setTimeout(()=>e.remove(),ms);return e}
function fxClamp(sp,e){const w=e.offsetWidth;e.style.left=Math.max(w/2+4,Math.min(sp.bd.clientWidth-w/2-4,sp.cx))+'px'}
function tileAnim(tl,cls,ms){tl.classList.remove('popt','shake','sink');void tl.offsetWidth;tl.classList.add(cls);setTimeout(()=>tl.classList.remove(cls),ms)}
let FXQ=[];
function flushFXQ(){if(UI.screen!=='game'||!FXQ.length)return;const q=FXQ;FXQ=[];q.forEach((f,j)=>setTimeout(f,180+j*260))}
function mortFX(k,on){if(UI.screen!=='game'){FXQ.push(()=>mortFX(k,on));return}
  const sp=fxSpot(k);if(!sp)return;
  const st=fxEl(sp,'stamp '+(on?'mort':'lift'),'',2350);st.textContent=tr(on?'MORTGAGED':'LIFTED');fxClamp(sp,st);
  if(on){tileAnim(sp.tl,'shake',500);boardShake();for(let i=0;i<6;i++){const a=i/6*Math.PI*2,r=20+Math.random()*8;fxEl(sp,'pop-spark',`--pc:var(--mu);--dx:${(Math.cos(a)*r).toFixed(1)}px;--dy:${(Math.sin(a)*r).toFixed(1)}px`,800)}}
  else{fxEl(sp,'pop-ring','--pc:var(--prim)',850);tileAnim(sp.tl,'popt',550)}
}
function sellFX(k,was){if(UI.screen!=='game'){FXQ.push(()=>sellFX(k,was));return}
  const sp=fxSpot(k);if(!sp)return;boardShake();
  if(0){const b=fxEl(sp,'drop-badge','',2150);b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>';
  b.appendChild(document.createTextNode(tr(was===5?'HQ SOLD':'−1 OFFICE')));fxClamp(sp,b);}
  for(let i=0;i<9;i++)fxEl(sp,'debris',`--dx:${(Math.random()*44-22).toFixed(1)}px;--dy:${(38+Math.random()*30).toFixed(1)}px;--rot:${Math.round(Math.random()*360-180)}deg`,1050);
  tileAnim(sp.tl,'sink',550);

function boardShake(){const bd=$('board');if(!bd||RM||UI.screen!=='game')return;bd.classList.remove('bshake');void bd.offsetWidth;bd.classList.add('bshake');setTimeout(()=>bd.classList.remove('bshake'),500)}
/* an office or HQ falls from the top of the screen onto its square, lands, then the board shakes */
function dropFX(k,lvl){if(UI.screen!=='game'){FXQ.push(()=>dropFX(k,lvl));return}
  const sp=fxSpot(k),o=S.own[k];
  if(!sp||o==null){sfx('build');return}
  if(RM){sfx('build');popFX(k,'build',lvl);return}
  const col=S.players[o].color,hq=lvl===5,ink='#1c1c1c';
  const svg=hq?`<svg viewBox="0 0 24 24" width="40" height="40"><path d="M5 21V4h9v17" fill="${col}" stroke="${ink}" stroke-width="1.5" stroke-linejoin="round"/><path d="M14 9h5v12h-5z" fill="${col}" stroke="${ink}" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 8h3M8 11.5h3M8 15h3M16 12.5h1M16 15.5h1M3 21h18" stroke="${ink}" stroke-width="1.5" stroke-linecap="round"/></svg>`
    :`<svg viewBox="0 0 24 24" width="30" height="30"><path d="M3 11.5L12 4l9 7.5V21H3z" fill="${col}" stroke="${ink}" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.5 21v-6h5v6" fill="none" stroke="${ink}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
  const fall=-(sp.cy+Math.max(0,sp.bd.getBoundingClientRect().top)+70);
  const w=document.createElement('div');w.className='dropw';w.style.cssText=`left:${sp.cx}px;top:${sp.cy}px;--fall:${fall}px`;
  w.innerHTML=`<div class="dropi">${svg}</div>`;sp.bd.appendChild(w);setTimeout(()=>w.remove(),1600);
  setTimeout(()=>{sfx('build');boardShake();popFX(k,'build',lvl)},560);
}
function popFX(k,kind,lvl){
  const tl=tiles[k],bd=$('board'),o=S.own[k];if(!tl||!bd||o==null||UI.screen!=='game')return;
  const col=S.players[o].color,cx=tl.offsetLeft+tl.offsetWidth/2,cy=tl.offsetTop+tl.offsetHeight/2;
  const add=(cls,css,ms)=>{const e=document.createElement('div');e.className=cls;e.style.cssText=`left:${cx}px;top:${cy}px;--pc:${col};`+(css||'');bd.appendChild(e);setTimeout(()=>e.remove(),ms);return e};
  add('pop-ring','',850);setTimeout(()=>add('pop-ring','',850),170);
  for(let i=0;i<10;i++){const a=i/10*Math.PI*2+Math.random()*.3,r=36+Math.random()*14;add('pop-spark',`--dx:${(Math.cos(a)*r).toFixed(1)}px;--dy:${(Math.sin(a)*r).toFixed(1)}px`,800)}
  const label=kind==='buy'?tr('SOLD'):lvl===5?tr('HQ!'):tr('+1 OFFICE');
  const ic=kind==='buy'?'<path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.5"/>':'<path d="M4 21V8l8-5 8 5v13M9 21v-6h6v6"/>';
  if(0){const b=add('pop-badge','',2150);b.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ic}</svg>`;b.appendChild(document.createTextNode(label));
  const w=b.offsetWidth;b.style.left=Math.max(w/2+4,Math.min(bd.clientWidth-w/2-4,cx))+'px';}
  tl.classList.remove('popt');void tl.offsetWidth;tl.classList.add('popt');setTimeout(()=>tl.classList.remove('popt'),550);
}
function buyHL(k){popFX(k,'buy');const tl=tiles[k],o=S.own[k];if(!tl||o==null||UI.screen!=='game')return;const x=document.createElement('i');x.className='buyhl';x.style.setProperty('--pc',S.players[o].color);tl.appendChild(x);setTimeout(()=>x.remove(),3100)}
function soundDiff(){
  if(!S||!S.players||!S.players.length){SPREV=null;return}
  const me=S.online?mySeat():-1,sum=a=>a.reduce((x,y)=>x+y,0);
  const c={gid:S.gid,turn:S.turn,card:!!UI.card,aucOn:!!S.auction,auc:S.auction?S.auction.amt:0,pos:S.players.map(p=>p.pos),cash:S.players.map(p=>p.cash),
    own:S.players.map(p=>Object.values(S.own).filter(o=>o===p.i).length),ownKey:JSON.stringify(S.own),ownObj:{...S.own},bld:sum(Object.values(S.bld).map(Number)),bldObj:{...S.bld},mort:Object.keys(S.mort).length,mortObj:{...S.mort},
    aud:S.players.map(p=>p.inAudit),bk:S.players.map(p=>p.bankrupt),over:S.phase==='over',offer:S.offer&&S.offer.to===me&&me>=0&&!S.offer.countering?S.offer.id:null};
  const P=SPREV;SPREV=c;
  if(!P||P.gid!==c.gid||P.pos.length!==c.pos.length)return;
  const ev=[];
  if(c.over&&!P.over)ev.push('win');
  if(c.bk.some((b,i)=>b&&!P.bk[i]))ev.push('bankrupt');
  if(c.aud.some((a,i)=>a&&!P.aud[i]))ev.push('lockup');
  if(c.offer!=null&&c.offer!==P.offer)ev.push('offer');
  if(sum(c.own)>sum(P.own)){ev.push('buy');Object.keys(S.own).filter(k=>!(k in P.ownObj)).forEach(k=>buyHL(+k))}else if(c.ownKey!==P.ownKey&&sum(c.own)===sum(P.own))ev.push('deal');
  if(c.bld>P.bld){Object.keys(S.bld).filter(k=>(+S.bld[k]||0)>(+P.bldObj[k]||0)).forEach((k,j)=>setTimeout(()=>dropFX(+k,+S.bld[k]),j*180))}else if(c.bld<P.bld){ev.push('sell');Object.keys(P.bldObj).filter(k=>(+S.bld[k]||0)<(+P.bldObj[k]||0)).forEach(k=>sellFX(+k,+P.bldObj[k]))}
  {const added=Object.keys(S.mort).filter(k=>!P.mortObj[k]),gone=Object.keys(P.mortObj).filter(k=>!S.mort[k]&&S.own[k]!=null);
   if(added.length)ev.push('mortgage');else if(gone.length)ev.push('unmortgage');
   added.forEach(k=>mortFX(+k,true));gone.forEach(k=>mortFX(+k,false))}
  if(c.aucOn&&!P.aucOn)ev.push('auction');else if(c.aucOn&&c.auc>P.auc)ev.push('bid');
  if(c.card&&!P.card)ev.push('card');
  const dc=c.cash.map((x,i)=>x-P.cash[i]);
  if(dc.some(d=>d<0))ev.push('loss');else if(dc.some(d=>d>0))ev.push('gain');
  if(c.turn!==P.turn){if(mine(S.players[c.turn]))ev.push('turn');UI.turnAt=Date.now()}
  if(ev.length)sfx(ev[0]);
  if(c.pos.some((x,i)=>x!==P.pos[i]))sfx('step');
}
